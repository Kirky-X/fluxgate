path = "benches/conversion.rs"
harness = false

[[bench]]
name = "sse"
path = "benches/sse.rs"
harness = false

[[bench]]
name = "routing"
path = "benches/routing.rs"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# 回到本地开发态：给主依赖加回 path = "../<lib>" 并在末尾恢复 [patch.crates-io]——否则 path 版与 registry 版并存会 trait 身份分裂。

[workspace]
# 示例集合并为单一 crate（examples/），内部按 feature 划分模块与 bin。
members = [
    "examples",
]
