[package]
name = "llm-gate"
version = "0.1.0"
edition = "2021"
description = "纯路由核心库 — IR/协议转换/Vendor 管理/路由决策/韧性，零 axum 与存储假设"
authors = ["Kirky-X <Kirky-X@outlook.com>"]
publish = false

[lib]
path = "src/lib.rs"

[features]
# 默认全量：独立消费 llm-gate 的开箱即用面（nexusflow 以
# default-features=false 按需转发，不受此影响）
default = ["full"]
# marker feature（与 nexusflow 同名 feature 对齐转发；当前无 cfg 消费点）
protocol = []
# vendor 栈：HTTP 出站 + limiteron 限流/熔断原语 + 队列通道
#（不含存储——原 nexusflow 侧 vendor-management→database 联动已解除）
vendor-management = ["dep:reqwest", "dep:limiteron", "dep:rand", "dep:async-channel"]
# router 带 oxcache（会话亲和表 / 响应缓存的存储层——CacheBackend trait）
router = ["vendor-management", "dep:oxcache"]
# 韧性模块门控（FallbackChain + 错误映射层），纯门控无实现体
resilience = []
# CostTracker 的分片锁并发 map（dashmap；选型评估：oxcache 的 DashMapMemoryBackend
# 是带 TTL 语义的缓存后端封装，不是裸并发 map 能力暴露，不适合当 CostTracker 容器）
cost-tracking = ["dep:dashmap"]
full = ["protocol", "vendor-management", "router", "resilience", "cost-tracking"]

[dependencies]
tokio = { version = "1", features = ["full"] }
futures = "0.3"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-channel = { version = "2", optional = true }
async-trait = "0.1"
tracing = "0.1"
rand = { version = "0.8", optional = true }
reqwest = { version = "0.13", features = ["json", "stream", "socks"], optional = true }
limiteron = { path = "../../../limiteron", default-features = false, features = ["tower-middleware", "ban-manager", "circuit-breaker", "gcra", "quota-control", "retry", "kit"], optional = true }
oxcache = { path = "../../../oxcache", default-features = false, features = ["minimal", "macros", "kit", "memory"], optional = true }
dashmap = { version = "6", optional = true }
# 配置全量写回（persist_and_swap 的 toml::to_string_pretty）
toml = "1"
# vendor 队列（VendorQueue 的 bounded channel）
# 配置热更新地基（dynamic/snapshot/loader 三面，与 nexusflow 侧声明一致）
confers = { path = "../../../confers", default-features = false, features = ["toml", "dynamic", "snapshot"] }
# i18n — Fluent 双束（en/zh）+ 语言检测链基座
fluent-bundle = { version = "0.16", default-features = false }
unic-langid = { version = "0.9", default-features = false }
sys-locale = { version = "0.3", default-features = false }

[dev-dependencies]
# 测试需要注入 limiteron MockClock（假时钟驱动熔断超时 / 限流窗口重置）
limiteron = { path = "../../../limiteron", features = ["test-clock"] }
# mock 上游 HTTP 服务（vendor/router 集成测试）
mockito = "1"
# 测试临时目录：RAII 唯一目录，取代手写 temp_dir 固定路径（并发跑测试不碰撞）
tempfile = "3"
futures-util = "0.3"
# retry 预算测试用 paused clock（start_paused；独立 -p 测试不走 workspace
# 依赖统一，test-util 必须显式声明）
tokio = { version = "1", features = ["full", "test-util"] }
