[package]
name = "nexusflow"
version = "0.1.0"
edition = "2021"
description = "智能 LLM 路由代理系统 - 多厂商统一管理、格式转换、智能调度"
authors = ["NexusFlow Contributors"]

[lib]
path = "src/lib.rs"

[features]
default = ["full"]
full = ["web-server", "database", "vendor-management", "router", "protocol", "infrastructure", "sdforge-integration", "logging"]
web-server = ["dep:axum", "dep:tower", "dep:tower-http", "dep:async-stream"]
database = ["dep:dbnexus", "dep:sea-orm"]
vendor-management = ["dep:reqwest", "dep:async-channel", "dep:limiteron"]
router = []
protocol = []
infrastructure = ["dep:oxcache", "dep:confers", "dep:trait-kit"]
sdforge-integration = ["dep:sdforge"]
logging = ["dep:inklog"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("openapi"))'] }

[dependencies]
# Web 框架
axum = { version = "0.8", features = ["macros"], optional = true }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.7", features = ["cors", "trace", "request-id"], optional = true }

# 数据库 — path dep 确保使用本地 trait-kit 0.3（kit feature 暴露 integrations::kit::DbNexusModule）
dbnexus = { path = "../dbnexus", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "permission", "sql-parser", "macros", "config-env", "with-time", "kit"], optional = true }
sea-orm = { version = "2.0.0-rc.42", default-features = false, optional = true }

# 日志 — path dep 确保 oxcache/dbnexus/trait-kit 全部本地对齐
inklog = { path = "../inklog", default-features = false, features = ["http", "cli", "sqlite", "kit"], optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", optional = true }

# 流控 — path dep 确保 trait-kit 0.3 对齐
limiteron = { path = "../limiteron", default-features = false, features = ["tower-middleware", "ban-manager", "circuit-breaker", "gcra", "quota-control", "kit"], optional = true }

# 缓存 — path dep 确保 trait-kit 0.3 对齐
oxcache = { path = "../oxcache", default-features = false, features = ["minimal", "macros", "kit", "memory"], optional = true }

# 配置
confers = { version = "0.4", default-features = false, features = ["toml", "env", "watch", "validation"], optional = true }

# DI — path dep（本地源码 0.3.0）
trait-kit = { path = "../trait-kit", default-features = false, features = ["async"], optional = true }

# SDK 框架 — path dep（本地 0.3.5 已修复 limiteron::FlowGuardError 不兼容问题）
sdforge = { path = "../sdforge", default-features = false, features = ["http", "security", "streaming"], optional = true }

# 序列化与核心
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
futures = "0.3"
futures-util = "0.3"
tokio-util = "0.7"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
once_cell = "1"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
bytes = "1"
reqwest = { version = "0.13", features = ["json", "stream", "socks"], optional = true }
async-channel = { version = "2", optional = true }
async-stream = { version = "0.3", optional = true }
sys-info = "0.9"
toml = "1"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.15"
mockall_double = "0.3"
http-body = "1.0"
futures-util = "0.3"
mockito = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
