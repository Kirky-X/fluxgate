#===============================================================================
# 智能 LLM 路由代理系统 - GitHub Actions CI/CD Workflow
# 基于 GitHub 官方 Rust 模板和 2026 年最佳实践
#===============================================================================

name: CI/CD

#------------------------------------------------------------------------------
# 触发条件
#------------------------------------------------------------------------------
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # 手动触发
  workflow_dispatch:
  # 定时任务: 每日安全扫描
  schedule:
    - cron: '0 0 * * *'

#------------------------------------------------------------------------------
# 环境变量
#------------------------------------------------------------------------------
env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: '1.92'
  APP_NAME: smart_llm_proxy

#------------------------------------------------------------------------------
# 作业定义
#------------------------------------------------------------------------------
jobs:
  #------------------------------------------------------------------------------
  # 作业 1: 代码质量检查 (快速反馈)
  #------------------------------------------------------------------------------
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Code Formatting Check
        run: cargo fmt --check --all

      - name: Clippy Linting
        run: cargo clippy --all-features -- -D warnings

      - name: Cargo Audit (Security)
        uses: actions-rs/audit-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  #------------------------------------------------------------------------------
  # 作业 2: 单元测试和集成测试
  #------------------------------------------------------------------------------
  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: quality-checks
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-test-

      - name: Run Tests
        run: cargo test --all-features --all

      - name: Upload Coverage Report
        uses: codecov/codecov-action@v4
        with:
          files: ./target/debug/lcov.info
          fail_ci_if_error: false

  #------------------------------------------------------------------------------
  # 作业 3: Docker 构建和扫描
  #------------------------------------------------------------------------------
  docker:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.APP_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  #------------------------------------------------------------------------------
  # 作业 4: 多平台交叉编译 (可选)
  #------------------------------------------------------------------------------
  cross-compile:
    name: Cross Compile
    runs-on: ubuntu-latest
    needs: tests
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cross-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cross-

      - name: Build Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/smart_llm_proxy

  #------------------------------------------------------------------------------
  # 作业 5: 发布 (仅在 tag 时运行)
  #------------------------------------------------------------------------------
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [tests, cross-compile]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/*/release/smart_llm_proxy
            target/*/release/smart_llm_proxy.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

