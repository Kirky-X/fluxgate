#===============================================================================
# 智能 LLM 路由代理系统 - Docker Compose 配置
# 支持 SQLite 数据持久化和多环境部署
#===============================================================================

services:
  app:
    # 镜像带版本：:latest 无法回滚也无法追溯构建了哪份代码，tag 与
    # Dockerfile 的 APP_VERSION 标签由同一个变量驱动，保持单一事实来源
    image: fluxgate:${FLUXGATE_IMAGE_TAG:-0.1.0}
    container_name: fluxgate-app
    build:
      # 构建上下文必须是仓库根：Dockerfile 以 bind mount 绑定 src / Cargo.toml，
      # .dockerignore 也按上下文根解析（保持根目录不动）
      context: ..
      dockerfile: docker/Dockerfile
      # vecboost 附加上下文：根 manifest 的 optional path 依赖 ../vecboost（仓库
      # 根的兄弟目录），--locked 解析 manifest 需要；路径相对 compose 文件目录
      additional_contexts:
        - vecboost=../../vecboost
      args:
        APP_VERSION: ${FLUXGATE_IMAGE_TAG:-0.1.0}
    restart: unless-stopped
    ports:
      - "8080:8080"
    # 配置路径经 CLI 参数指向数据卷：镜像内不含配置文件（.dockerignore 安全
    # 排除），main 以第一个 CLI 参数解析路径。配置放在数据卷目录内是刻意的——
    # admin 配置写回走「同目录临时文件 + rename 原子覆盖」（config/manager.rs
    # persist_and_swap），rename 越过单文件 bind mount 挂载点必然 EBUSY（原
    # ../config.toml:/app/config.toml:ro 挂法下 /admin/config 与模型条目写回
    # 全部 500）；写在数据卷目录内即普通文件系统语义，且随数据卷持久化。
    # 宿主机侧准备（config.toml 不入库，部署私有物；从任意 cwd 启动都要先做）：
    #   cp config.example.toml data/config.toml
    command: ["/bin/server", "/app/data/config.toml"]
    environment:
      - RUST_LOG=info
      - RUST_BACKTRACE=1
      # vault 主钥（持久部署建议注入）：64 位 hex = 32 字节。缺失时按镜像层
      # 默认的 FLUXGATE_MASTER_KEY_FILE（/app/data/vault_master.key，随数据卷
      # 持久）生成——不设该变量则回落容器内 ~/.fluxgate/，随容器层走、重建即丢，
      # 柜内密钥随之不可解（此项已由镜像默认值覆盖，此处不再重复声明）。
      # 空值等价未设置（启动回落文件生成）。
      - FLUXGATE_MASTER_KEY=${FLUXGATE_MASTER_KEY:-}
      # 可选: API Keys (通过环境变量注入)
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      # SQLite 数据持久化 + 配置文件载体：compose 的短语法相对路径按 compose
      # 文件所在目录解析（docker/ → 仓库 data/），从任意 cwd 启动都一致。原
      # 写法用命名卷 driver_opts + ${PWD}/data，${PWD} 取自调用 shell，在
      # docker/ 目录或 CI 下会指向错误路径
      - ../data:/app/data
    # 容器内 127.0.0.1 指容器自身：本地联调的上游桩（如示例 mock 上游
    # 127.0.0.1:8001）跑在宿主机时，把厂商 api_base 指到
    # host.docker.internal 即可触达（Linux 经 host-gateway 映射）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 健康检查由镜像 HEALTHCHECK 提供（Dockerfile 为唯一定义），不在这里
    # 重复声明：compose 覆盖会与镜像层参数漂移（原 5s/10s start-period 不一致）
    # 资源限制 (生产环境推荐；limits 由 compose v2 强制，reservations 仅作调度提示)
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 512M
        reservations:
          cpus: '0.50'
          memory: 128M
    # 网络配置
    networks:
      - fluxgate_network

#------------------------------------------------------------------------------
# 网络配置
#------------------------------------------------------------------------------
networks:
  fluxgate_network:
    driver: bridge
    # 不写死子网：固定 172.28.0.0/16 与宿主机已有 docker0/其他项目网络重叠时
    # 直接报 "Pool overlap" 启动失败；交给 Docker 自动分配，本地需要固定段时
    # 在 docker-compose.override.yml 里加 ipam 配置
