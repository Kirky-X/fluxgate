[package]
name = "fluxgate-examples"
edition = "2021"
publish = false
# MSRV 与根 `fluxgate` 包同值（事实源见根 Cargo.toml 的 `rust-version` 注释）。
# 必须显式声明：clippy.toml 不再重复 `msrv` 键，clippy 只读包自己的
# `rust-version`——缺它则该 crate 的 MSRV 门控 lint 回落到「运行时工具链版本」，
# lint 集合随 stable 漂移（与 ci.yml 按 1.97 下限固定 lint 集合的口径不符）。
rust-version = "1.97.1"
# bin 全部经显式 [[bin]] 声明（带 required-features），关闭自动发现避免同名 target 冲突
autobins = false

[features]
# default 覆盖 rest + embedded + sdk（embedded 拉 fluxgate full+db-sqlite、rest/sdk 各依赖）；
# grpc 刻意不入 default，保留「普通构建不需 protoc」的隔离（见根 Cargo.toml grpc feature 注释）。
default = ["rest", "embedded", "sdk"]
# rest：裸 HTTP 直连，不依赖 fluxgate 本体
rest = ["dep:anyhow", "dep:futures-util", "dep:reqwest"]
# embedded：库形态嵌入，需 fluxgate 完整装配（full）+ 一个后端（fluxgate/db-sqlite）
embedded = ["dep:fluxgate", "dep:axum", "fluxgate/full", "fluxgate/db-sqlite"]
# sdk：HTTP 客户端门面，只开 fluxgate sdk feature——default-features=false 保证
# `--no-default-features --features sdk` 的轻量构建不把网关服务器拖进来
sdk = ["dep:fluxgate", "fluxgate/sdk"]
# grpc：tonic 客户端，不依赖 fluxgate 本体；仅拉客户端运行时依赖，代码生成见 build.rs
grpc = ["dep:tonic", "dep:tonic-prost", "dep:prost"]

[dependencies]
# 跨示例共享，非 optional（体积可控，且 rest/embedded/sdk 至少各需其一）
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
futures = { version = "0.3", default-features = false, features = ["std"] }

# 按示例门控：保住「轻 sdk 构建 / rest 不拖网关 / grpc 不引 fluxgate」的既有依赖足迹
anyhow = { version = "1", default-features = false, features = ["std"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }
# default-tls 必留：rest 示例直连部署网关，缺 TLS 特性时 -p 单成员构建（--features rest）
# 运行期 https 调用必失败；与根包口径一致（0.13 起 default-tls = rustls）
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "default-tls"], optional = true }
# 按本成员直用面最小集（mount_router.rs：axum::{Json,Router} + routing::get + axum::serve）：
# http1（serve 的 hyper 服务）+ json（Json 提取/响应）+ tokio（serve 运行时）；
# macros/query/tower-log/tracing 本成员零消费（不加也能靠 workspace 归一化拿到根包集，
# 但单成员构建下应自洽，不抄根包集）。
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"], optional = true }
# default-features=false：由 embedded/sdk 各自精确开启，避免 full 被无条件并入 sdk 构建
fluxgate = { path = "..", default-features = false, optional = true }
# channel（非 transport）：本成员只消费客户端 stub——build.rs 以 build_server(false)
# 生成，transport = [server, channel] 会白拉 h2/socket2/tokio-stream 服务端栈。
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen"], optional = true }
tonic-prost = { version = "0.14", default-features = false, optional = true }
prost = { version = "0.14", default-features = false, features = ["derive"], optional = true }

[build-dependencies]
# build.rs 无条件参与编译（即便 grpc 关闭也会编译 build.rs 源码，只是不在其中运行 protoc），
# 故代码生成器须非 optional。代价：examples 任何构建都会编译 tonic-build/tonic-prost-build
#（不触发 protoc），远小于把 grpc 拆成独立 crate 的维护成本。
tonic-build = { version = "0.14", default-features = false }
tonic-prost-build = { version = "0.14", default-features = false }

# 八个 bin 入口点全部保留；required-features 让未被启用特性覆盖的 bin 在对应构建中被跳过。
[[bin]]
name = "rest_http"
path = "src/bin/rest_http.rs"
required-features = ["rest"]

[[bin]]
name = "standalone"
path = "src/bin/standalone.rs"
required-features = ["embedded"]

[[bin]]
name = "mount_router"
path = "src/bin/mount_router.rs"
required-features = ["embedded"]

[[bin]]
name = "chat"
path = "src/bin/chat.rs"
required-features = ["sdk"]

[[bin]]
name = "stream_chat"
path = "src/bin/stream_chat.rs"
required-features = ["sdk"]

[[bin]]
name = "embed"
path = "src/bin/embed.rs"
required-features = ["sdk"]

[[bin]]
name = "admin"
path = "src/bin/admin.rs"
required-features = ["sdk"]

[[bin]]
name = "rerank"
path = "src/bin/rerank.rs"
required-features = ["sdk"]

[[bin]]
name = "responses"
path = "src/bin/responses.rs"
required-features = ["sdk"]

[[bin]]
name = "grpc_client"
path = "src/bin/grpc_client.rs"
required-features = ["grpc"]
