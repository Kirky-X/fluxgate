# Tag 删除时清理对应的 GitHub Release（对齐 confers 基线）。
# Fluxgate 以源码形态发布（Release 只带 tag 的自动生成源码包，不附二进制、
# 不发 crates.io），故无 yank 提示环节：删除 tag 时只需删除 Release。

name: Tag Deleted

on:
  delete:

permissions:
  contents: write

jobs:
  cleanup:
    name: Cleanup Release
    if: github.event.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Get tag name
        id: get_tag
        env:
          # 经 env 传递：tag 名是用户可控数据，直接内插进 run 会形成命令注入面
          REF: ${{ github.event.ref }}
        run: |
          echo "tag_name=${REF}" >> "$GITHUB_OUTPUT"

      - name: Delete GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.get_tag.outputs.tag_name }}
        run: |
          # 404（无对应 Release）是预期分支，放行；其余失败（鉴权/限流/网络）
          # 必须让作业变红——否则 tag 已删而对应的 Release 仍然存在
          if ! RELEASE_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}" \
              --jq '.id' 2>/tmp/gh_err.txt); then
            if grep -qE "HTTP 404|Not Found" /tmp/gh_err.txt; then
              echo "⚠️ No release found for tag $TAG_NAME"
              exit 0
            fi
            echo "::error::查询 Release 失败（非 404）:"
            cat /tmp/gh_err.txt
            exit 1
          fi

          echo "Deleting release $RELEASE_ID for tag $TAG_NAME"
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}"
          echo "✅ GitHub Release deleted successfully"
