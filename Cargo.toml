[package]
name = "fluxgate"
version = "0.1.0"
edition = "2021"
# MSRV 单一事实源：cargo 解析期据此硬拒更低工具链；CI 用此下限，Docker/release 用当前 stable。
rust-version = "1.97.1"
# examples/ 是独立 workspace 成员、非本包示例目录：关闭自动发现，否则其顶层 .rs 会被误作 example target 编译失败。
autoexamples = false
# tests/ 按功能域目录化、Cargo 自动发现不递归，故关闭之、改用下方 [[test]] 显式注册（新增测试必须登记，特性门控留文件顶 `#![cfg(feature = ...)]`）。
# 非 default 特性专用的测试须加 required-features（与文件顶 cfg 同集），避免 default 口径产出空壳二进制、污染测试与覆盖率报告。
autotests = false
# benches/ 同理关闭自动发现、走下方 [[bench]] 显式注册（共享 fixture benches/common 不参与发现，新增基准必须登记）。
autobenches = false
description = "智能 LLM 路由代理系统 - 多厂商统一管理、格式转换、智能调度 | Intelligent multi-provider LLM routing gateway"
authors = ["Kirky-X <Kirky-X@outlook.com>"]
repository = "https://github.com/Kirky-X/fluxgate"
keywords = ["llm", "gateway", "proxy", "openai", "anthropic", "routing"]
categories = ["network-programming", "web-programming::http-server", "api-bindings"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "fluxgate"
path = "src/main.rs"
required-features = ["full"]

[features]
# default 携带 db-sqlite：`cargo run` 默认仍为 sqlite 文件库；库嵌入方用 default-features = false 自选后端。
# `--features full` 单独使用不含任何数据库后端——dbnexus 的「无数据库 feature」守卫会编译报错，full 必须搭配一个 db-*。
default = ["full", "db-sqlite"]
full = ["web-server", "database", "vendor-management", "router", "protocol", "infrastructure", "sdforge-integration", "logging", "resilience", "cost-tracking", "sdk", "vault"]
# 数据库后端三组互斥由 dbnexus 编译期守卫强制（embedded 与 server-side 不可混），驱动选择交给使用方/部署方。
# `?` 语法：仅当依赖已被 database/logging 激活时生效；replica-routing 必须随任一后端透传
db-sqlite = ["dbnexus?/sqlite", "dbnexus?/runtime-tokio-rustls", "dbnexus?/replica-routing", "inklog?/sqlite"]
db-postgres = ["dbnexus?/postgres", "dbnexus?/runtime-tokio-rustls", "dbnexus?/replica-routing", "inklog?/postgres"]
db-mysql = ["dbnexus?/mysql", "dbnexus?/runtime-tokio-rustls", "dbnexus?/replica-routing", "inklog?/mysql"]
# 显式入链 database/infrastructure；hex/sha2/subtle 等为 api/middleware 直用
web-server = ["dep:axum", "dep:tower", "dep:tower-http", "dep:async-stream", "router", "sdforge-integration", "http", "database", "infrastructure", "dep:limiteron", "dep:hex", "dep:sha2", "dep:subtle", "dep:once_cell"]
# 宏门控开关，无实现体：sdforge `#[forge]` 宏按**目标 crate** 的 feature 求值 `cfg(feature = "http")`——
# 无同名 feature 时 RouteRegistration 整体被 cfg 掉，#[forge] 站点路由（/health）静默丢失。随 web-server 启用。
http = []
# 韧性模块（FallbackChain + 错误映射 + metrics）；熔断/重试复用 limiteron
resilience = []
# cost-tracking：CostTracker 的分片锁并发 map
cost-tracking = ["dep:dashmap"]
# async_logger（DB sink）无条件消费 inklog 类型，故 logging 为编译前提。
database = ["dep:dbnexus", "dep:sea-orm", "dep:async-channel", "dep:url", "protocol", "logging"]
# vendor 栈：reqwest 出站 + limiteron 限流/熔断原语 + 队列通道，rand 供加权采样；不携带存储。
vendor-management = ["dep:reqwest", "dep:limiteron", "dep:rand", "dep:async-channel"]
# 保密柜：cocoon AEAD + secrecy；db 后端门控，SDK 嵌入回落 FileKeyStore
vault = ["dep:cocoon", "dep:secrecy", "dep:sha2", "dep:hex", "dep:rand"]
# router 模块（含 vendor-management 联动）；dep:oxcache 供 response_cache/bootstrap 直用 CacheBackend。
router = ["vendor-management", "dep:oxcache"]
# vecboost 进程内分类器；关闭时 difficulty 走纯规则（w_clf>0 被校验拒绝）
# path dep：vecboost 库面快速演进期、feature 组合未稳，升级跟随上游 tag 并跑全量测试。
difficulty-classifier = ["dep:vecboost"]
# 语义响应缓存：vecboost BGE 嵌入 + 线性余弦检索（强制租户隔离）
semantic-cache = ["dep:vecboost"]
# marker feature（当前无 cfg 消费点；保留组合位与单开关语义）
protocol = []
infrastructure = ["dep:oxcache", "dep:trait-kit"]
sdforge-integration = ["dep:sdforge"]
# gRPC 服务器（sdforge grpc 门面）：不进 full——编译 proto/sdforge.v1.proto 需 protoc，默认构建不引入该工具链前置。
# feature 名兼作 `#[forge]` 的 `cfg(feature = "grpc")` 门控；服务器另受 web-server + logging 门控
grpc = ["dep:sdforge", "sdforge/grpc", "sdforge/graceful"]
logging = ["dep:inklog"]
# sdk：HTTP 客户端 SDK（src/sdk，调用已部署网关的 Rust 客户端）；reqwest 复用 vendor-management 的 optional 依赖。
# eventsource-stream 仅做 SSE 事件分帧，url 供 base URL 拼接。
sdk = ["dep:reqwest", "dep:eventsource-stream", "dep:url"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("openapi"))'] }

[dependencies]
# axum 关默认，只取 macros/http1/json/query/tokio 与请求 span 日志面
axum = { version = "0.8", default-features = false, features = ["macros", "http1", "json", "query", "tokio", "tower-log", "tracing"], optional = true }
# tokio 关默认，按直用面取最小集；fs/process/io-std 零调用
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tower = { version = "0.5", default-features = false, optional = true }
tower-http = { version = "0.7", default-features = false, features = ["cors", "trace", "request-id"], optional = true }

# 数据库层：kit 模块 + pool-warmup + retry（database.rs 直用 RetryPolicy）
# 后端与 runtime 不在此写死：Cargo feature 只加不减，写死会锁死单后端，由 db-* 三组透传按构建选择。
dbnexus = { version = "0.6.0-rc.9", default-features = false, features = ["permission", "sql-parser", "macros", "config-env", "with-time", "kit", "migration", "auto-migrate", "pool-warmup", "retry"], optional = true }
# sea-orm 零特性面（ConnectionTrait/Statement/DatabaseBackend/Value 直用，无 entity derive、无 sqlx 驱动）
sea-orm = { version = "2.0", default-features = false, optional = true }

# 日志层：落库后端随 db-* 透传；fast-masking + secret-scan 仅日志面启用
inklog = { version = "0.3.0-rc.9", default-features = false, features = ["kit", "fast-masking", "secret-scan"], optional = true }
# 配置加载与热重载：dynamic/snapshot/loader + json 投影 + security-rules
confers = { version = "0.6.0-rc.10", default-features = false, features = ["toml", "json", "dynamic", "snapshot", "security-rules", "hot-reload-kit"] }
# tracing 显式集（关默认等价声明）：std + attributes（info!/span! 等事件宏的展开面）
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
# log→tracing 事件桥：reqwest/sea-orm 经 log crate 输出而 inklog LogAdapter 不投自定义 sink，装 LogTracer 并入统一总线。
tracing-log = { version = "0.2", default-features = false, features = ["log-tracer", "std"] }
# 主依赖只用 registry + 自定义 Layer（bootstrap.rs），不接 fmt/json/env-filter/ansi 面；
# registry 蕴含 std，不再重复声明
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"], optional = true }

# 流控 — "retry" 提供重试原语（delay_for_attempt / RetryPolicy），是网关出站链路唯一的重试延迟实现；
# src/sdk 另持一份最小对齐实现（sdk feature 不依赖 limiteron，见 absorb-official-sdk-parity D6）。
limiteron = { version = "0.3.0-rc.7", default-features = false, features = ["tower-middleware", "ban-manager", "circuit-breaker", "gcra", "quota-control", "retry", "kit"], optional = true }

# 缓存
oxcache = { version = "0.5.0-rc.8", default-features = false, features = ["minimal", "macros", "kit", "memory"], optional = true }

# 难度分类器 path dep：跟随本地 checkout，关默认特性避开服务端栈
vecboost = { path = "../vecboost", default-features = false, optional = true }

# DI（async + shutdown 面）
trait-kit = { version = "0.5.0-rc.9", default-features = false, features = ["async", "shutdown"], optional = true }

# 服务框架门面。不声明 streaming：其流式分帧面本仓零引用，SSE 分帧由 src/protocol 自实现。
sdforge = { version = "0.5.0-rc.8", default-features = false, features = ["http", "security", "health", "metrics", "context", "graceful", "openapi", "docs", "schemars"], optional = true }

# 序列化与核心（全部显式特性 + 关默认）
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
thiserror = { version = "2", default-features = false, features = ["std"] }
async-trait = { version = "0.1", default-features = false }
# futures 显式集：executor（bootstrap.rs 的 block_on 同步桥；executor 蕴含 std）
futures = { version = "0.3", default-features = false, features = ["executor"] }
# chrono 关默认：clock（Utc::now/Local::now，蕴含 std）+ serde；default 里的 oldtime/wasmbind 本仓零消费。
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
# rand 0.10：与图内 dbnexus/inklog/sdforge 已拉的 0.10 收敛（残余 0.8/0.9 由上游三方持有，非本仓直依赖）。
rand = { version = "0.10", default-features = false, features = ["std", "std_rng", "thread_rng"], optional = true }
once_cell = { version = "1", default-features = false, features = ["std"], optional = true }
uuid = { version = "1", default-features = false, features = ["v4", "serde", "std"] }
url = { version = "2", default-features = false, features = ["std"], optional = true }
bytes = { version = "1", default-features = false, features = ["std"] }
# reqwest 0.13 语义下 default-tls = rustls；显式列出 default 面（default-tls/charset/http2/system-proxy），
# 其余压缩（gzip/brotli/zstd/deflate）、cookies/form/multipart/http3/blocking/hickory-dns 本仓零调用。
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "socks", "default-tls", "charset", "http2", "system-proxy"], optional = true }
# SSE 事件分帧（sdk feature 的流式响应解析）
eventsource-stream = { version = "0.2", default-features = false, features = ["std"], optional = true }
async-channel = { version = "2", default-features = false, features = ["std"], optional = true }
async-stream = { version = "0.3", default-features = false, optional = true }
# CostTracker 的分片锁并发 map（cost-tracking）
dashmap = { version = "6", default-features = false, features = ["inline"], optional = true }
# 配置全量写回（persist_and_swap 的 toml::to_string_pretty）；显式列出 default 面
toml = { version = "1", default-features = false, features = ["std", "serde", "parse", "display"] }
# i18n — Fluent 双束（en/zh）+ 语言检测链基座（i18n 模块常开）
fluent-bundle = { version = "0.16", default-features = false }
unic-langid = { version = "0.9", default-features = false }
sys-locale = { version = "0.3", default-features = false }
# API Key SHA256 摘要与常量时间比较（api/middleware 消费）；纯摘要只需 alloc，default 的 oid 零消费。
# 0.11 对齐兄弟库；sqlx 侧 0.10 锁定属上游，随其升级自然收敛。
sha2 = { version = "0.11", default-features = false, features = ["alloc"], optional = true }
hex = { version = "0.4", default-features = false, features = ["std"], optional = true }
subtle = { version = "2.6", default-features = false, features = ["std"], optional = true }

# 保密柜：cocoon 逐条加密 + secrecy 内存包装；rand/sha2/hex 复用既有条目
cocoon = { version = "0.5", default-features = false, features = ["std", "getrandom", "thiserror"], optional = true }
secrecy = { version = "0.10", default-features = false, optional = true }


[dev-dependencies]
# retry 预算测试用 paused clock（start_paused）；特性与主 entries 联合（test-util 叠加在 rt/sync/time 上）
tokio = { version = "1", default-features = false, features = ["test-util"] }
# i18n 键位守卫：严格解析 .ftl（零 Junk）与占位符抽取（与 fluent-bundle 同源语法树）
fluent-syntax = { version = "0.12", default-features = false }
# log 门面桥测试：LogTracer 转发断言需 log 宏与 tracing Layer 捕获面
# （tracing-subscriber 主依赖为 optional，测试单独声明 registry 面）
log = { version = "0.4", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
# admin CRUD 测试的 ConfigManager 写路径：RAII 唯一临时目录（getrandom 供随机文件名）
tempfile = { version = "3", default-features = false, features = ["getrandom"] }
http-body = { version = "1", default-features = false }
# 测试里的 StreamExt/SinkExt 面；io/sink/channel/compat 等重型面零调用
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
# mockito 关默认：default = color（colored 彩色终端输出）+ parking_lot，均非测试断言所需
mockito = { version = "1", default-features = false }
# 测试需注入 limiteron MockClock（假时钟驱动熔断超时 / 限流窗口重置）；MockClock 仅在 test-clock feature 下公开。
limiteron = { version = "0.3.0-rc.7", default-features = false, features = ["test-clock"] }
# Criterion 组件级基准（透传/转换/路由决策）。只留 cargo_bench_support；裁掉 plotters（HTML 图）与 rayon（单机基线，单线程统计数值等价）。
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

