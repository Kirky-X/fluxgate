#===============================================================================
# Fluxgate 发布流水线（对齐 confers 基线：推 v* tag 触发）
#
# 产物：Release 只带 GitHub 自动生成的源码压缩包（zip / tar.gz），不附二进制
# 产物、不发 crates.io。二进制部署走两条路：docker 镜像（docker/Dockerfile
# 独立构建，纯 registry 依赖）或本机构建 `cargo build --locked --release`。
#
# 触发面：tag 推送为主；workflow_dispatch 供恢复/重发（如 tag 已推送但流水线
# 失败）——手动触发必须显式给 version，且该 tag 必须已存在（resolve 步骤做
# 存在性校验），避免 Releases API 按默认分支 HEAD 新建 tag 造出幻影发布。
#===============================================================================
name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本（x.y.z 或 x.y.z-rc.N，不带 v 前缀；须已有对应 tag）'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  # 固定组：tag 推送（refs/tags/…）与手动重发（refs/heads/…）是不同 ref，
  # 按 ref 分组会让同版本两条 run 并发建 Release
  group: Release
  cancel-in-progress: false

jobs:
  #-----------------------------------------------------------------------------
  # 创建 GitHub Release（自动生成变更说明；rc/beta/alpha 后缀标记预发布）
  #-----------------------------------------------------------------------------
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 本 job 只用 gh api 与 action-gh-release（release 侧走自己的 token
          # 输入），无需把 contents: write 的 git 凭据落盘到 .git/config
          persist-credentials: false
      # 版本号解析：tag 触发取 tag 名（去 v 前缀），手动触发取输入值。
      # 两条路都过 semver 校验，且必须命中已存在的 tag——Releases API 在 tag
      # 不存在时按默认分支 HEAD 新建 tag，版本号笔误会造出「源码包 = 分支内容、
      # tag 指向错提交」的幻影发布，故先做存在性校验再建 Release。
      # 输入与版本值均经 env 传递，不内插进 run。
      - name: Resolve version
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${INPUT_VERSION}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            # 清洗换行后再回显：原值经注解回显时，内嵌换行可伪造工作流命令
            SAFE="${VERSION//$'\n'/%0A}"; SAFE="${SAFE//$'\r'/%0D}"
            echo "::error::非法版本号: ${SAFE}（期望 x.y.z 或 x.y.z-rc.N）"
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${VERSION}" >/dev/null \
            || { echo "::error::tag v${VERSION} 不存在——先推送 tag 再重发"; exit 1; }
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          # 显式给 tag_name：手动触发时 GITHUB_REF 是分支，不显式指定会落在错误 ref
          tag_name: v${{ steps.resolve.outputs.version }}
          generate_release_notes: true
          draft: false
          # 预发布判定跟 semver 语义走：版本含 '-' 即预发布（rc/beta/alpha 等）
          prerelease: ${{ contains(steps.resolve.outputs.version, '-') }}

      - name: Verify release uniqueness (idempotency guard)
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          COUNT=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate --jq "[.[] | select(.tag_name == \"${TAG}\")] | length")
          echo "release objects for ${TAG}: ${COUNT}"
          if [ "${COUNT}" != "1" ]; then
            echo "::error::expected exactly 1 release for ${TAG}, found ${COUNT}; release state is not idempotent"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
