#===============================================================================
# NexusFlow CI 质量门禁（对齐 confers 7 仓库统一基线）
# fmt / clippy / check / test / coverage / security
#
# 与 confers 基线的差异：
#   - NexusFlow 通过 path 依赖集成 7 个兄弟库（Cargo.toml 中 ../<lib>），
#     所有 cargo 作业先克隆兄弟库到仓库上级目录，否则依赖解析必然失败；
#   - 本仓库无 Criterion 基准、无 deny.toml，故无 benchmarks 作业，
#     security 作业仅跑 cargo audit（补 deny.toml 后再加 cargo deny check）；
#   - 无 CodeQL（按安全门禁约定 CodeQL 为 opt-in，不进默认流程）；
#   - 无 docker 作业：镜像构建依赖与本仓 Cargo.lock 同源的兄弟库提交，
#     未全部推送远端前纯远端构建不可行（docker/Dockerfile 的 SIBLING_PINS
#     已就绪，兄弟库推送后可随时恢复该作业）。
#===============================================================================
name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  # 每日安全扫描：仅 security 作业响应 schedule，其余作业跳过
  schedule:
    - cron: '37 5 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_VERSION: '1.92'
  # path 依赖的 7 个兄弟库，克隆到 $GITHUB_WORKSPACE/../ 下满足 ../<lib> 解析
  SIBLING_REPOS: 'confers dbnexus inklog limiteron oxcache sdforge trait-kit'

#-------------------------------------------------------------------------------
# 兄弟库克隆说明：NexusFlow 的 Cargo.toml 以 ../<lib> path 依赖集成上列仓库，
# 且 [patch.crates-io] 将自研库重定向到同级本地源码。CI 上必须先把它们
# 克隆到仓库同级目录，cargo metadata 才能完成依赖解析。
#-------------------------------------------------------------------------------

jobs:
  #-----------------------------------------------------------------------------
  # 格式检查
  #-----------------------------------------------------------------------------
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Checkout sibling libraries (path dependencies)
        run: |
          set -euo pipefail
          for repo in $SIBLING_REPOS; do
            git clone --depth 1 "https://github.com/Kirky-X/${repo}.git" "${{ github.workspace }}/../${repo}"
          done
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # 1.92
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  #-----------------------------------------------------------------------------
  # Clippy 零告警
  #-----------------------------------------------------------------------------
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Checkout sibling libraries (path dependencies)
        run: |
          set -euo pipefail
          for repo in $SIBLING_REPOS; do
            git clone --depth 1 "https://github.com/Kirky-X/${repo}.git" "${{ github.workspace }}/../${repo}"
          done
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # 1.92
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # db-* 三组互斥由 dbnexus 编译期守卫强制（db-backend-selection），
      # --all-features 同时打开三个后端必然编译失败——clippy 跑 default 口径
      # （full + db-sqlite），非 default 后端组合由 check/test 的特性矩阵覆盖
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  #-----------------------------------------------------------------------------
  # 编译检查（默认特性 / 三后端特性矩阵）
  #-----------------------------------------------------------------------------
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Checkout sibling libraries (path dependencies)
        run: |
          set -euo pipefail
          for repo in $SIBLING_REPOS; do
            git clone --depth 1 "https://github.com/Kirky-X/${repo}.git" "${{ github.workspace }}/../${repo}"
          done
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # 1.92
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check default features
        run: cargo check --workspace
      # --all-features 会同时启用互斥的 db-* 三组（dbnexus 守卫必触发），
      # 改为按后端逐一检查；db-sqlite 已由 default 覆盖
      - name: Check db-postgres features
        run: cargo check --workspace --no-default-features --features "full,db-postgres"
      - name: Check db-mysql features
        run: cargo check --workspace --no-default-features --features "full,db-mysql"

  #-----------------------------------------------------------------------------
  # 测试（mockito/mockall 自包含，无外部服务依赖）
  #-----------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Checkout sibling libraries (path dependencies)
        run: |
          set -euo pipefail
          for repo in $SIBLING_REPOS; do
            git clone --depth 1 "https://github.com/Kirky-X/${repo}.git" "${{ github.workspace }}/../${repo}"
          done
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # 1.92
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # --all-features 因 db-* 互斥不可用（同 check 注释）；测试跑 default
      # 口径（full + db-sqlite，mockito/mockall 自包含）
      - name: Run tests
        run: cargo test --workspace

  #-----------------------------------------------------------------------------
  # 覆盖率（生成 + 上传 Codecov）
  # 注意：暂不设 --fail-under-lines 门禁——首次测量前不知道真实基线，
  # 先采集数据，基线明确后再按 confers 基线加 ≥80% 行覆盖率门禁。
  #-----------------------------------------------------------------------------
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Checkout sibling libraries (path dependencies)
        run: |
          set -euo pipefail
          for repo in $SIBLING_REPOS; do
            git clone --depth 1 "https://github.com/Kirky-X/${repo}.git" "${{ github.workspace }}/../${repo}"
          done
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # 1.92
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage
        # --all-features 因 db-* 互斥不可用（同 check 注释）；覆盖率按 default
        # 口径采集，与 test job 一致
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          fail_ci_if_error: false

  #-----------------------------------------------------------------------------
  # 供应链安全（每日 schedule 唯一响应者；cargo audit 只读 Cargo.lock，
  # 无需兄弟库与编译）
  #-----------------------------------------------------------------------------
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # 1.92
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Install cargo-audit
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit
