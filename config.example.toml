[server]
host = "0.0.0.0"
port = 8080

[database]
path = "./data/llm_proxy.db"
pool_size = 5

[[vendors]]
id = "openai"
name = "OpenAI"
type_ = "openai"
api_key_env = "OPENAI_API_KEY"
api_base = "https://api.openai.com/v1"
enabled = true
concurrency = { requests_per_second = 100 }
rate_limit = { type = "token", max_tokens = 10000000 }

[[vendors.models]]
model_id = "gpt-3.5-turbo"
enabled = true
weight = 1.0

[[vendors.models]]
model_id = "gpt-4"
enabled = true
weight = 1.0

[[vendors]]
id = "anthropic"
name = "Anthropic"
type_ = "anthropic"
api_key_env = "ANTHROPIC_API_KEY"
api_base = "https://api.anthropic.com/v1"
enabled = true
concurrency = { requests_per_second = 100 }
rate_limit = { type = "token", max_tokens = 10000000 }

[[vendors.models]]
model_id = "claude-3-opus-20240229"
enabled = true
weight = 1.0

# gRPC Server（feature = "grpc"）— sdforge grpc 门面。缺席或 enabled = false
# 时 gRPC 服务器禁用。认证复用 [auth] 段摘要校验；TLS 由外部反代承担。
[grpc]
enabled = false
host = "0.0.0.0"
port = 50051

[global_model]
enabled = true
strategy = "weighted"

# Pricing — vendor + model 维度的输入/输出 token 单价（每 1k tokens，USD）
# 未配置 [[pricing]] 时 CostCalculator 全部返回 0.0
[[pricing]]
vendor_id = "mock-openai"
model_id = "gpt-4"
input_per_1k_tokens = 0.03
output_per_1k_tokens = 0.06

[[pricing]]
vendor_id = "mock-anthropic"
model_id = "claude-3-opus-20240229"
input_per_1k_tokens = 0.015
output_per_1k_tokens = 0.075
