[package]
name = "nexusflow-example-grpc-client"
edition = "2021"
publish = false

[dependencies]
# 版本对齐 sdforge grpc feature 的依赖面（NexusFlow Cargo.lock：tonic 0.14.6 /
# tonic-prost 0.14.6 / prost 0.14.4），复用工作区既有编译缓存。
# transport 提供 Channel 连接，codegen 提供生成代码引用的 tonic::codegen 面。
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen"] }
# 生成代码的 unary/streaming 编解码走 tonic_prost::ProstCodec，须显式入依赖
tonic-prost = { version = "0.14", default-features = false }
prost = { version = "0.14", default-features = false, features = ["derive"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros"] }

[build-dependencies]
# 与 sdforge build.rs 同一套 0.14 代码生成器（default-features = false，
# 不生成 connect 快捷构造，客户端用 Channel::builder 手动建连）
tonic-build = { version = "0.14", default-features = false }
tonic-prost-build = { version = "0.14", default-features = false }
