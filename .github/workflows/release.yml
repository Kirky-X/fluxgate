#===============================================================================
# NexusFlow 发布流水线（对齐 confers 基线：推 v* tag 触发）
#
# 产物（NexusFlow 以应用形态发布，产物为二进制，不发 crates.io）：
#   - nexusflow-<ver>-x86_64-unknown-linux-gnu.tar.gz
#     ubuntu runner 编译，动态链接系统 libsqlite3（sqlx 走 pkg-config，非 bundled）
# 说明：musl 静态产物曾借道 Docker 构建产出，后随 CI 去 docker 化移除（镜像
# 现为纯 registry 依赖，可独立构建）；需要 musl 静态二进制时在本机执行
# `docker build -f docker/Dockerfile .` 自行提取。
#===============================================================================
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # 发布产物用当前受支持的 stable，与 docker/Dockerfile 的 rust base 对齐（1.99）。
  # 原值 1.92 已低于兄弟库 MSRV（dbnexus/limiteron/sdforge 均声明 1.97.1），
  # cargo 会在依赖解析期直接拒绝构建。MSRV 下限兼容性由 ci.yml 按
  # Cargo.toml 的 rust-version 校验，不靠本作业保证
  RUST_VERSION: '1.99'
  BIN_NAME: nexusflow

jobs:
  #-----------------------------------------------------------------------------
  # 创建 GitHub Release（自动生成变更说明；rc/beta/alpha 后缀标记预发布）
  #-----------------------------------------------------------------------------
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}

  #-----------------------------------------------------------------------------
  # gnu 动态链接二进制（Ubuntu 基线）
  #-----------------------------------------------------------------------------
  build-gnu:
    name: Build (${{ matrix.target }})
    needs: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install system dependencies (sqlx links system libsqlite3)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-${{ matrix.target }}
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }} --bin ${{ env.BIN_NAME }}
      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ASSET="${{ env.BIN_NAME }}-${VERSION}-${{ matrix.target }}.tar.gz"
          tar -czf "$ASSET" -C "target/${{ matrix.target }}/release" "${{ env.BIN_NAME }}"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
      - name: Attach to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: ${{ env.ASSET }}
