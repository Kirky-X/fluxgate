# =============================================================================
# Fluxgate 运行时配置示例 —— 随仓唯一的全量参考
# =============================================================================
# 用法：`cp config.example.toml config.toml` 后按需修改。网关二进制缺省读取
# 工作目录的 config.toml，也可把配置路径作为唯一命令行参数传入：
#   cargo run --release            # 读 ./config.toml
#   cargo run --release -- /path/to/deploy.toml
#
# 为什么 config.toml 不入库：它承载部署私有物（API Key 摘要、vendor 直连地址、
# 配额与优先级），已写进 .gitignore。本文件才是配置面的权威参考——Config
# 结构体的每个段、每个字段都在这里出现（src/config/mod.rs 为类型事实源），
# 显式值与 serde default 逐位一致，「复制即用 = 默认行为」。
#
# 维护纪律：新增/删除配置项必须同步本文件与 tests/config/config_toml_example_test.rs
#（该测试对这里做结构性断言：默认值锁定 + 新键不得缺席——后者由测试对 Config
# 序列化面做全量键名扫描（新键缺席即红），serde default 会让缺席键静默过解析，
# 只有键名清单能测出示例过期）。
#
# 热更新标注：✅ = POST /admin/config 或文件监听改后下一请求即生效；
#             ❌ = restart-required（建站期消费，须重启进程）。
#             写回语义：写回 = 内存态全量序列化，故 ① 未进 Config 结构体的自定义
#             段会在首次写回时从磁盘消失，不要在本文件里放网关不认识的段；
#             ② 写回前比对磁盘内容指纹：文件自上次加载/写回后被进程外修改（含按
#             「改文件后重启」追加的段、被热重载以 restart-required 拒绝的编辑）时，
#             管理面写回以 config-disk-modified-refusing-write 显式失败且不改磁盘——
#             先热重载或重启应用该编辑，再走管理面写回。
# =============================================================================

# ❌ 需重启 —— 监听地址与端口（TLS 由外部反代承担，网关明文监听）
[server]
host = "0.0.0.0"
port = 8080

# ❌ 需重启 —— 数据库后端为编译期选择（db-backend-selection）：默认构建 =
# full + db-sqlite（本示例即 sqlite 文件库）。PostgreSQL/MySQL 以
#   cargo build --no-default-features --features "full,db-postgres"   # 或 db-mysql
# 构建，并配置完整连接 URL（三组互斥由 dbnexus 编译期守卫强制）。
# url 非空时优先生效；留空则 path 按 sqlite 文件库处理（需 db-sqlite，
# 否则启动报 database-backend-missing 并附重建指引）。
# 注意：切换后端不做数据迁移——新后端从空库起步（schema 自动建表）。
[database]
path = "./data/llm_proxy.db"
# url = "postgres://127.0.0.1:5432/fluxgate"
# url = "mysql://127.0.0.1:3306/fluxgate"
pool_size = 5

# ✅ 热生效 —— per-model 能力/定价目录（字段对齐 agentstem ModelEntry）。
# 定价单位 =「currency 计价，每 1M tokens」（对齐 estimate_usage_cost 的计价
# 消费口径，与 [[pricing]] 的「每 1k tokens」不同源，勿混用）。无独立计价的
# 缓存档填 0（OpenAI 平台不单独计费 cache write）。登记条目 context_window
# 必须 > 0 且 model_id 全局唯一（validate_config 加载与热更新两路同拒）；
# 未登记模型回落 per-flavor 保守默认（openai 128k / anthropic 200k /
# ollama 4096，见 config::model_catalog 文档）。能力查询：已登记返回真实值
#（TUI auto-compact 依赖非 0 窗口）。条目上限 1024。
# 示例（按需取消注释）：
# [[model_catalog]]
# model_id = "claude-sonnet-4-20250514"
# context_window = 200000
# input_price = 3.0
# output_price = 15.0
# cache_read_price = 0.3
# cache_creation_price = 3.75
# # 可选：重排计价（每 1000 篇文档，currency 同口径；0/缺省 = 未登记，
# # 仅 rerank 请求级成本写入 request_logs.cost_usd 时消费）
# rerank_price_per_1k_docs = 0.0
# # 可选：长上下文价（仅 price_factor_mode = "cache_expected" 时生效）——
# # 估 prompt tokens（body 字符数/4）超阈值且本价 > 0 时，改用本价替代
# # 输入价参与价格因子；阈值或本价任一为 0 即不启用。
# long_context_input_price = 0.0
# long_context_threshold_tokens = 0
# currency = "usd"          # usd | cny，未知币种使加载失败
# max_output_tokens = 8192
# supports_tools = true
# supports_thinking = true
# # 可选：Anthropic 自动缓存断点注入策略（仅 anthropic 型 vendor
# # 转换出站生效；与 supports_* 能力位正交）。缺省 = 启用 / 上限 4 /
# # 锚序 tools→system→last_user（超限保留锚序尾部）。缓存写按 1.25×
# # 计费、命中读按 0.1×——成本/性能取舍可按条目关闭。
# [model_catalog.cache_breakpoints]
# enabled = true
# max_breakpoints = 4
# anchors = ["tools", "system", "last_user"]

# ✅ 热生效 —— API Key 认证（key 吊销/轮换、enabled 开关经 POST /admin/config
# 立即生效：认证中间件每请求从热配置现读）
[auth]
enabled = true
# api_keys 存 SHA256 hex 摘要（小写 64 字符，非小写 hex-64 的条目永远无法
# 认证，validate_config 直接拒启动）。生成：echo -n "your-api-key" | sha256sum
# 认证时对请求 key 现场算摘要做常量时间比较，明文密钥不落盘、不进内存。
api_keys = [
    # "example-key-hash-1234567890abcdef..."
]

# API key 档位表（可选）：拥塞准入（[admission]）的优先级基准。hash 与
# api_keys 同形态（SHA256 hex）；tier ∈ dedicated/guaranteed/elastic/spot
#（基准权重 1000/100/1/0.1，未知档位串使加载失败）。未在此声明的 key（含
# api_keys 列表全部）缺省 elastic——不配置本子表时行为与现状逐位一致。
# 示例（按需取消注释，hash 必须是真实 64 位小写 hex）：
# [[auth.keys]]
# hash = "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
# tier = "dedicated"
# token_quota 与 cost_quota_millicents（WP8 配额，可选，默认 0=不限）：
# token 窗口按 input+output 合计，成本窗口按 millicents（1 单位 = 1e-5 USD）；
# 与 [rate_limit]（请求数）/ [admission]（拥塞 shed）独立叠加，任一触发即拒。
# token_quota = 100000
# cost_quota_millicents = 5000000

# 请求头名与前缀（保留段结构；当前中间件按 Authorization/Bearer 提取）
[auth.header]
name = "Authorization"
prefix = "Bearer"

# ❌ 需重启 —— CORS（sdforge 中间件固化于 Router 构造，更新后接口返回
# restart_required 提示）
# 注：sdforge 校验要求 origin 携带 http(s):// 前缀，通配 "*" 不被接受——
# 所有条目均为 "*"（如下默认值）时网关不挂 CORS 层；需要跨域时请写具体
# origin，如 allowed_origins = ["https://console.example.com"]
[cors]
enabled = true
allowed_origins = ["*"]
allowed_methods = ["GET", "POST", "OPTIONS", "PUT", "DELETE"]
allowed_headers = ["*"]
allow_credentials = false
max_age = 86400

# ❌ 需重启 —— 入站限流（本段在 Router 构造期消费，与 [server]/[cors] 先例
# 一致；热下发列二期）
#
# 规则形态（[[rate_limit.rules]]，滑动窗口）：
# - id: 规则标识（观测/日志维度）
# - path: 端点路径前缀（如 "/v1/chat/completions"）；缺省 = 全局规则，走 tower
#   全局层（GlobalRateLimitLayer + QuotaLimiter），由 TenantKeyExtractor 按
#   per_tenant 决定分桶——默认 true 即按租户（API key SHA256 摘要）分桶，
#   与 path 规则同语义
# - per_tenant: 按调用方 API key（SHA256 摘要）分桶，默认 true。认证关闭或
#   请求未携带 key 时统一归入单一 anonymous 桶（此时退化为全局桶）；配置为
#   false 时为规则级单桶（全局层以固定空串键共享桶）
# - window_secs / max_requests: 窗口时长（秒）与窗口内最大请求数；超限返回
#   429 + Retry-After
#
# rules 为空（默认）= 共享令牌桶兜底（容量 100、补速 10/s 的令牌桶），与历史版本行为逐位一致。
[rate_limit]

# 示例（按需取消注释）：
# [[rate_limit.rules]]
# id = "chat-tenant"
# path = "/v1/chat/completions"
# per_tenant = true
# window_secs = 60
# max_requests = 100

# ✅ 热生效 —— 出站重试策略（worker 每请求从热配置现读，下一次重试循环即用
# 新参数）
# - max_retries: 单 vendor 内最大重试次数（不含首次调用）
# - retryable_status_codes: 触发重试的状态码集合（429 走指数退避，5xx 走固定
#   1s；集合外状态码一律不重试）
# - initial_delay_ms / factor / max_delay_ms: 指数退避 首延迟/乘数/单次上限
# - jitter: 429 分支的退避抖动比例（±20%）
# - spread_jitter: Retry-After 与 5xx 固定间隔分支的同步惊群展宽比例——
#   延迟 = base + U(0, spread_jitter)×base（base 为 Retry-After 值或 1s），
#   1.0 = 全范围展宽 [base, 2×base)，多实例/多并发在同一 Retry-After 下不再
#   同刻唤醒重试。回滚路径：spread_jitter = 0 完全恢复旧行为（Retry-After
#   原样返回、5xx 固定 1s）。
# - max_total_attempts: 换路 fallback 的总尝试预算（主 vendor 重试耗尽或
#   429/5xx 时排除该 vendor 重路由，防止 vendor 数 × 重试数爆炸）
# - retry_budget_secs: 单请求重试总时间预算。**默认 0 = 不限时（现状）**。
#   >0 时单 vendor 重试循环与跨 vendor fallback 循环在每次等待/重派前检查
#   「锚点耗时 + 下次延迟」是否超预算，超限返回最后错误（Portkey 递减式预算
#   对照——防重试等待把单请求拖到分钟级）。
# - amplification_gate: 重试放大守门器（λ_eff/f_c 亚稳态防护）。**默认 false
#   = 只记 metrics 计数，行为与现状逐位一致**。开启时在换路 fallback 入口
#   评估：失败率 f > 0.8·f_c（临界失败率）→ 本请求 max_total_attempts 临时
#   收紧到 1 + tracing::warn（误触发退化为单尝试，fail-safe 方向正确）；
#   r·f > 0.95 → 发散告警（只 warn）。输入：r = 重试请求数/失败请求数、
#   f = 全生命期失败率、λ = 60s 流量窗总量/60、C = Σ enabled vendor 并发上限
# （全部不限时则 C=0，不收紧只告警）。
[retry]
max_retries = 3
retryable_status_codes = [429, 500, 502, 503]
initial_delay_ms = 1000
factor = 2.0
max_delay_ms = 16000
jitter = 0.2
spread_jitter = 1.0
max_total_attempts = 8
retry_budget_secs = 0
amplification_gate = false

# ✅ 热生效 —— 路由权重系数与选择算法（Router 每次路由从热配置现读）
#
# 权重公式：
#   weight = w_model×model.weight + w_queue×queue_factor + w_window×window_factor
#          + w_latency×latency_factor + w_error×error_factor
# 最终权重经温度平滑 w^(1/temperature)。
#
# 默认值保持历史 3D 权重（0.4/0.3/0.3），新维度 w_latency/w_error 默认 0
#（关闭）——线上路由行为不变，显式开启才生效。
#
# 命名预设（等价系数组合，手填即可）：
#   quality = { w_model = 0.7, w_queue = 0.2, w_window = 0.1 }
#   latency = { w_model = 0.2, w_queue = 0.2, w_window = 0.2, w_latency = 0.4, latency_ref_ms = 500.0 }
#   cost    = { w_model = 0.2, w_queue = 0.2, w_window = 0.6 }
[routing]
w_model = 0.4
w_queue = 0.3
w_window = 0.3
# EWMA 第 4 维（默认关闭）：延迟因子 = latency_ref_ms/(latency_ref_ms+ewma_ms)，
# 错误因子 = 1 − ewma_error_rate；错误率 EWMA α=0.2 固定，延迟 EWMA 已改
# Peak-EWMA（见下方 ewma_tau_ms；且 ewma_latency_ms 口径已收窄为非流式端到端
# e2e——流式为 TTFT 道，见下方【顺序依赖】注释）
w_latency = 0.0
w_error = 0.0
latency_ref_ms = 1000.0
# 温度平滑（herding 缓解）：1 = 不平滑；>1 压平差距；<1 放大差距
temperature = 1.0
# 选择算法："weighted"（轮盘赌，默认）| "power_of_two"（Po2C 实验：均匀采样
# 2 候选、按 EWMA 延迟择优；等熵监控有数据后再评估切默认）| "linucb"
#（LinUCB bandit 档——候选集内按 UCB = ⟨x,θ̂⟩ + α√(xᵀA⁻¹x) argmax，
# per (abstract_model, vendor_id) 臂、成败 0/1 代理奖励，特征 = [截距,
# ln(1+消息数), ln(1+body 字符数), 含 tools, 流式]；需网关进程接线
# BanditState 且请求特征可得，未接线/特征缺失时回退 weighted；亲和 hard 命中
# 仍优先、fail-open 安全网路径不受影响）。未知值一律按 "weighted"
#（默认与回滚同路径）。
selection = "weighted"
# LinUCB 探索参数 α：ucb(x,α) 的探索半径。**仅 selection="linucb" 时被咨询**
#（默认 selection="weighted"，本参数不参与任何路径——关闭由 selection 档位
# 承担）。0/负值 = 关闭探索（纯贪心 θ̂ argmax），非有限按 0。臂矩阵正则初值
# = max(α²,1)·I（进程启动定死；α 热更只影响探索半径，已有臂的 A/b 不重建；
# 状态重启归零、特征集变更不可迁移）。
ucb_alpha = 1.0
# 负载维（queue_factor）输入档位（单选）：
# - "queue"（默认）：worker 队列深度——历史行为，线上路径不变
# - "in_flight"：在途请求数（并发 permit 占用，流式 permit 随流存活，对长流
#   真实生效——LiteLLM least_busy / Kong least_connections 同信号）
# - "in_flight_relative"：在途相对化 (x−fleet_mean)/max(1,fleet_mean)
#  （vLLM production-stack 公式，分母钳 1 防近空闲舰队放大噪声）
# 注意：负载维输入是单选开关，切到 in-flight 档时队列深度退出该维（不叠加为
# 次级加权项）；未知值按 "queue" 处理（回滚阀）。
load_signal = "queue"
# Peak-EWMA 时间常数 τ（毫秒）：延迟 EWMA 的动态平滑系数
# α = 1−exp(−Δt/τ)（Kong DECAY_TIME=10s 同值）。久未采样 α→1 快速反映恢复；
# 高频采样平滑抗噪。落账前热同步（POST /admin/config 立即生效）。
# 0 = 极限「完全采新样本」（无平滑），慎用。
ewma_tau_ms = 10000
# min+buffer 候选集缓冲（LiteLLM lowest_latency_buffer 语义）：> 0 时选择先取
# 「ewma_e2e ≤ 最低×(1+buffer)」的候选集、集合内均匀随机（延迟相近的候选共享
# 流量，防打爆最快者）。**默认 0.0 = 关闭**（轮盘赌与历史逐位一致）。
# 【顺序依赖】延迟信号已按口径分道（TTFT/端到端/排队；流式 TTFT 以
# 「send→上游响应头」近似——严格首 token 口径网关侧拿不到）。先观察
# /admin/metrics 的 ewma_e2e_ms / ewma_ttft_ms 分道数据，再把 w_latency
# 调非零 / latency_buffer 调非零。
latency_buffer = 0.0
# 请求级权重开关（X-Weight 头，LiteLLM simple_shuffle _router_weights 对照）：
# **默认 false = 头被忽略**（路由行为与现状逐位一致）。开启且请求携带合法
# X-Weight（有限正数，非法值忽略）时覆盖 model.weight 参与权重计算。
allow_request_weight = false
# 全冷却 fail-open 安全网：**默认 false = 全候选被剔除时保持 Validation 错误
#（现状）**。开启时全部候选因 CB Open / Throttled 被路由层剔除的情况下，回落
# 「忽略状态但 enabled」的候选集加权选择。现实约束：Fluxgate 无主动健康检查
# 驱动的冷却，全部为真实失败冷却——本开关覆盖的是 CB Open 超时未过窗口 /
# 限流窗口未重置，语义弱于 LiteLLM 的 health-check 限定；把已冷却 vendor
# 重新纳入流量是有意冒险，仅建议有兜底容量的部署开启。
fail_open_when_all_cooling = false
# Retry-After 提示：**默认 false = 换路耗尽时原错误冒泡（503 语义不变）**。
# 开启且耗尽时全部排除原因为 Throttled → 返回 AllVendorsThrottled（429 +
# Retry-After 头，秒数 = 各 vendor 限流窗口重置剩余的 min）。已知边界：
# handler 首路由即全 Throttled 的入口场景（? 早退、Validation 错误丢失原因）
# 不覆盖。
retry_after_hint = false
# 会话亲和模式：**默认 "hard"（现状：命中即返回，绑定 vendor 在合格集合内时
# 必选）**；"soft"：命中软化为评分项——命中 vendor 权重 ×(1 +
# affinity_boost_factor) 后与其余候选照常竞争（弱粘性，提升负载均衡响应度；
# 注意可能降低缓存/前缀复用命中率，affinity_hit_rate 指标已有，切换前先定
# 观察窗口）。未知值一律按 "hard"。
affinity_mode = "hard"
# soft 模式命中 vendor 的权重乘子基准：权重乘 (1 + affinity_boost_factor)。
# 默认 1.0（×2 boost）；仅在 soft 模式生效，负值按 0 处理。
affinity_boost_factor = 1.0
# 亲和键租户隔离：**默认 false = legacy 键 affinity:{session_key}（现状逐位
# 一致）**。开启时键改为 affinity:{api_key_hash}:{session_key}（hash 与响应
# 缓存同源）——实为租户劫持修复（两租户同 session id 不再互相劫持），建议
# 上线开启；键格式变更换代使存量绑定一次性失效（TTL 1h 内自然过渡）。
affinity_tenant_scoped = false
# rerank 分数归一化：none（默认，原样透传）| sigmoid（映射到 0-1）|
# minmax（批内缩放，等值批全 0.5）。只改 /v1/rerank 响应分数，不改排序与 index。
rerank_score_normalization = "none"
# 价格因子：[[model_catalog]] 单价参与加权路由（**默认开启**）。因子 =
# 候选模型 (input_price+output_price)/2（每 1M tokens；cache 档不进因子），
# 乘性修正 weight ×= min_p/p——等价条件下低价候选胜出。中性豁免：目录为空 /
# 候选全部未登记 / 单候选 / 未登记或 0 价候选。**关闭后路由行为与现状逐位
# 一致**（开关 off 直接跳过整个因子路径）。
price_factor_enabled = true
# 价格因子单价口径：**默认 "nominal"**——单价 p = (input_price+output_price)/2
#（每 1M tokens，与历史一致）。"cache_expected"：cache_read_price > 0 的条目改用
# (cache_read_price+output_price)/2，配合前缀亲和表达缓存友好偏好。未知值按
# "nominal" 处理（回滚阀）。
price_factor_mode = "nominal"
# SLA/满意度虚拟队列打分项强度 V（SLARouter 零模型版）：**默认 0.0 = 关闭**
#（惩罚项不参与权重、虚拟队列 Q 不更新，路由行为与现状逐位一致）。>0 时每
# 候选权重末尾乘惩罚因子
#   1 / (1 + V·Ĉ_m + max(0, Q·(α − ŝ_m)))
# 其中 ŝ_m = 1 − EWMA 错误率（无观测数据 = 1.0 冷启动乐观）；Ĉ_m =
# [[pricing]] 的 (input+output)/2 每 1k 单价；缺价候选记「候选集内已知单价的
# 中位数」（保守不奖励——记 0 会让无定价 vendor 获得最小惩罚、乘法式下权重
# 最高，与成本感知目的相反）；候选集全无定价时成本项整体置 0（退化为纯 Q 项，
# 进程内 warn 一次）。虚拟队列 Q 按租户（调用方 API key 哈希）分桶、无租户
# 上下文时用 "global"（分桶不受 affinity_tenant_scoped 影响——那只是亲和键
# 格式开关）；每轮选择完成后对偶更新 Q ← max(0, Q + α − ŝ_selected)（决策时
# 更新、无需执行结果回传；重启归零，Lyapunov 收敛自动重建）。与失败率软降权、
# 亲和 boost 独立乘法叠加。负值/非有限值同样视为关闭。
sla_v = 0.0
# 目标服务水平 α（[0,1]）：α < ŝ（满意度达标）→ Q 衰减归 0；α > ŝ（服务欠账）
# → Q 累积、欠账 vendor 权重被压。默认 0.95；非有限/越界值钳回 [0,1]
#（NaN 按 0 处理 = Q 恒 0，退化为纯成本项）。
sla_alpha = 0.95
# LPS 排队论延迟前瞻软约束强度 δ（论文式 10：Ŵ=(α/μ)^k/(μ−α)，ρ→1 发散；
# α = 60s 流量窗到达率，μ = 1/ewma_e2e_ms，k = vendor 并发上限缺省 100）。
# **默认 0.0 = 关闭**（Ŵ 不参与权重，行为与现状逐位一致）。>0 时权重末尾乘
# 1/(1 + δ·Ŵ/Ŵ_ref)——乘法软约束为对报告线性 −δ·Ŵ 的有意偏差（线性负项会触发
# compute_weight 非正归零保护造成权重归零剔除）；Ŵ_ref = 当次候选集内 Ŵ 中位数
#（相对归一，零新增配置；全候选发散时中位数=CAP → 因子均匀不扭曲选择）。无
# e2e 观测的 vendor Ŵ=0 中性（冷启动不惩罚）。注意 ewma_e2e 口径含排队，作为
# 服务时长近似会高估 Ŵ（粗分类定位）。负值/非有限视为关闭。
lps_delta = 0.0
# LPS 硬约束门控：**默认 false = 不消费 deadline、不做可行集筛选**（行为与
# 现状逐位一致）。开启后按 Ŵ≤deadline 筛可行集（deadline 取 x-deadline-ms 头，
# 缺省用 default_deadline_ms），可行集为空时改选 Ŵ 最小者（JITServe 软信号
# 语义，不拒绝服务）；亲和 hard 命中优先于本筛选。
lps_deadline_gate = false
# 默认截止（毫秒）：lps_deadline_gate 开启且请求未携带 x-deadline-ms 头时
# 使用。默认 10000 为示例值，按业务 P99 与 /admin/metrics 的 ewma_e2e_ms
# 观察调整。
default_deadline_ms = 10000

# 前缀亲和 PoTC（`[routing.prefix_affinity]`，默认关）：开启后稳定前缀哈希出
# 2 个带内候选、按平滑权重择优（双哈希网关形态）。✅ 热生效
# - enabled: 前缀亲和开关。**默认 false**（选路路径与历史逐位一致）。
# - prefix_chars: 前缀键截取的首条 user content 头部字符数，默认 512。
[routing.prefix_affinity]
enabled = false
prefix_chars = 512

# 难度定档（`[routing.difficulty]`，默认关——缺段 = enabled=false 完全旁路，
# 行为与历史逐位一致）。✅ 热生效（字段热读）
# 启用模板（按需取消注释；整段缺省即默认行为）：
# - groups: 触发定档的请求模型名（归一化 trim+lowercase 后精确匹配；命中才
#   改写，其余模型名原样直通）。不得与真实 model_id 撞名（validate_difficulty）
# - w_clf / w_rule: 分类概率与规则计分权重，S = w_clf·p + w_rule·r；二者不可
#   同时为 0。w_clf > 0 需 `difficulty-classifier` feature，缺失时配置校验拒绝
# - score_low / score_high: S ≤ score_low → low、S ≥ score_high → high，
#   区间内 → mid
# - mid_band_policy: 仅 tiers.mid 缺省的两档退化形态消费——"strong"（默认，
#   中带→high）/ "cheap"（→low）/ "nearest"（近阈值档，平局取 high）
# - tiers: 档位 → 抽象模型名（enabled 时 low/high 必填；mid 缺省 = 两档退化）
# - lexicon: 特征词法表覆盖（缺省 = 内置默认；显式数组 = 整体替换，不追加）。
#   条目不得为空、不得含首尾空白/控制字符；英文词条区分大小写。
# - scoring: 规则计分权重/封顶（缺省 = 历史常量；各项权重通常合计 1.0）
# - classifier: vecboost laya 决策引擎运行参数（difficulty-classifier feature 门控）
# [routing.difficulty]
# enabled = false
# groups = ["chat-basic"]
# w_clf = 0.6
# w_rule = 0.4
# score_low = 0.35
# score_high = 0.65
# mid_band_policy = "strong"
# [routing.difficulty.tiers]
# low = "chat-basic"
# mid = "chat-mid"
# high = "chat-pro"
# [routing.difficulty.lexicon]
# hard = ["证明", "推导", "求解", "算法", "prove", "step by step"]
# easy = ["你好", "谢谢", "翻译", "hello", "thanks", "translate"]
# math_symbols = ["+", "*", "/", "^", "=", "∫", "∑", "√", "π", "≤", "≥", "≠", "∞"]
# question_marks = ["?", "？"]
# code_fence_markers = ["```"]
# [routing.difficulty.scoring]
# w_hard = 0.40              # hard 词命中项（命中数 / hard_cap 封顶）
# hard_cap = 5.0             # hard 命中数封顶
# w_code_fence = 0.15        # 代码围栏出现项
# w_math = 0.15              # 数学符号密度项
# math_cap = 12.0            # 数学符号数封顶
# w_questions = 0.10         # 多问拆解项
# question_cap = 3.0         # 问号数封顶
# w_messages = 0.05          # 消息数项
# message_cap = 10.0         # 消息数封顶
# w_tools = 0.05             # tools 出现项
# w_length = 0.10            # 请求体长度项
# length_cap = 8000.0        # 请求体长度封顶（字符，≤ 8000）
# w_easy_penalty = 0.30      # easy 词惩罚项
# easy_cap = 3.0             # easy 命中数封顶
# [routing.difficulty.classifier]
# timeout_ms = 150            # 单次推理超时；超时按分类失败降级纯规则
# failure_threshold = 5       # 连续失败 N 次 → 熔断 open（纯规则），成功清零
# probe_interval_secs = 30    # 熔断 open → 半开探测间隔
# cache_ttl_secs = 300        # 定档结果缓存 TTL；0 = 不缓存
# model_path = "models/laya"  # laya checkpoint 目录
# engine = "candle"           # "candle"（默认）| "onnx"（需上游 vecboost onnx feature）

# ✅ 热生效 —— 韧性覆盖面（执行路径每请求从热配置现读）
#
# - cover_all_paths: 熔断/重试/换路覆盖到透传与流式路径。**默认 false**：
#   关闭时透传非流式（无熔断）、透传流式、转换流式三条裸路径与历史行为逐位
#   一致（仅转换非流式有换路 fallback）。开启后（建议先在灰度环境评估）：
#   1) 透传非流式由 per-vendor 熔断器包裹，失败进入换 vendor 换路循环；
#   2) 两条流式路径的 send+响应头校验段由熔断器包裹——首字节（响应头）前
#      失败自动换 vendor 重派（OpenRouter 语义），流中错误仍以 SSE error
#      事件终止、不再换路；
#   3)【运维影响面】熔断 Open 状态会直接拒绝透传/流式请求（该请求转而换路；
#      无候选时返回 503 "circuit open"）。历史版本熔断只作用于转换非流式
#      路径，开启本开关后透传与流式流量同样受熔断治理。
#   换路预算与触发条件复用 [retry] 段（max_total_attempts / 触发=全部）。
#
# - failure_rate_gate: 失败率软降权。**默认 false**——关闭时路由权重与历史
#   逐位一致（窗口计数在 /admin/metrics 常开，纯观测）。开启时每 vendor 的
#   60s 滑窗失败率超阈即权重打折（软降权只打折不剔除，路由层 ==Available
#   过滤不动——劣化 vendor 仍参与路由，只是份额收缩）：窗内总样本 ≥
#   failure_rate_min_samples 且 失败率 > failure_rate_threshold → 该 vendor
#   权重 × failure_rate_penalty（LiteLLM 数值对照 0.1）。429 感知：失败率窗口
#   把 RateLimited（上游限流/本地 token 窗耗尽）也计入失败——独立于熔断器
#   计数（CB 对 429 无感），上游正常限流也可能触发降权，penalty=0.1 而非
#   剔除、风险有界。
#
# - circuit_open_timeout_ms: 熔断 Open→HalfOpen 的超时窗口（毫秒），**默认
#   30000**（<100ms 会被 validate_config 拒绝——等于关闭熔断冷却）。调小加速
#   故障恢复探测（对抖动上游恢复更灵敏）、调大避免对持续故障上游的探针风暴；
#   热生效：经 POST /admin/config 全量更新后，新建 vendor 实例即采用新值
#  （已热建的实例沿用创建时窗口）。
#
# - expose_fallback_headers: 回退链可观测响应头。**默认 false**（成功响应与
#   现状逐字节一致）：开启时成功响应附 x-fluxgate-vendor（最终命中）、
#   x-fluxgate-model、x-fluxgate-attempts（总尝试次数）、
#   x-fluxgate-fallbacks（逗号分隔尝试链，含最终命中者；流式在响应头阶段
#   写入）。✅ 热生效（执行路径每请求现读）。
[resilience]
cover_all_paths = false
expose_fallback_headers = false
failure_rate_gate = false
failure_rate_min_samples = 5
failure_rate_threshold = 0.5
failure_rate_penalty = 0.1
circuit_open_timeout_ms = 30000

# ✅ 热生效（周期读取） —— 主动健康检查探针（被动恢复：成功清除冷却/黑名单，失败保持现状）
#
# 探针任务常驻，mode/interval_secs/probe_strategy 每周期热读（✅ 标注如实）：
# mode=off 的周期为 no-op（开销可忽略），热切 mode 即时生效。
#
# - mode: "off"（默认，该周期 no-op、零探测行为）| "suspect_only"（仅探测
#   冷却/黑名单/不可用态对象）| "all"（全量周期探测，并发上限 2）
# - interval_secs: 探测周期（默认 300）
# - timeout_ms: 单次探测超时（默认 5000）
# - probe_strategy: "free"（默认，零成本 GET 上游模型列表端点；成功仅清除
#   vendor 级冷却）| "minimal_call"（max_tokens=1 计费请求验证 key；成功额外
#   清除该 key 黑名单/冷却与其名下模型级熔断计数）
[health]
mode = "off"
interval_secs = 300
timeout_ms = 5000
probe_strategy = "free"

# ✅ 热生效（每请求现读；账本跨热更保留） —— 成本与 token 维度配额（WP8 预扣-回补）
#
# - enabled: 默认 false（零判限）；与 [rate_limit]/[admission] 独立叠加；
# - window_secs: 固定窗口（默认 3600；0 非法，validate 拒绝）；
# - est_chars_per_token: 预扣输入估算常数（默认 4，与 count_tokens 同口径）。
#   注：配额余量的响应头暴露（X-RateLimit-* 形态）为规格明文 Out of Scope，
#   不提供配置位。
# per-key 限额放 [[auth.keys]]（token_quota/cost_quota_millicents，0=不限）。
# 预扣 = 预估输入 token×输入单价 + max_tokens×输出单价（单价以 model_catalog
# 四档价为准，同模型未登记目录时回退 [[pricing]] 跨 vendor 最高价，保守）；
# 非流式响应后、流式（转换流与透传流）结束后按实际 usage 回补差额（可返还可追扣）；
# 超限 429 + Retry-After。透传流断流或全程无 usage（OpenAI 不带
# stream_options.include_usage）时不回补；失败请求的预扣不返还。
# ⚠️ quota.enabled = true 而 [auth] 关闭时，配额租户键取自客户端自报头，
# 计费控制可被伪造头旁路（启动日志会 warn，见 SECURITY 文档）。
[quota]
enabled = false
window_secs = 3600
est_chars_per_token = 4

# ✅ 热生效 —— 拥塞感知优先级准入（准入每请求从热配置现读）
#
# 网关侧并发占用率（Σ in_flight / Σ vendor 并发上限）达到 congestion_threshold
# 时，新请求的档位基准权重与「当前在途最小档」直比：低于者直接
# 429 + Retry-After（不排队）；同档/高档照常放行（同档内保持先到先得）。
# w_tier 见 [[auth.keys]]（缺省 elastic=1.0）。
# burst/debt 的 per-key EWMA（到达速率/被拒频度）只进观测口径的优先级公式
#   priority = w_tier / (1+α_slo·ℓ*) / (1+α_burst·b) / (1+α_debt·d)
#（`admission_priority`，供诊断），**不参与** shed 判定——同档请求不得被抑制；
# ℓ*（SLO 缺口）维度无数据源恒 0（该项恒 1，α_slo 预留）。
# 健康检查路径永不卸载。
[admission]
# **默认 false = 完全关闭**：准入判定旁路、EWMA 不记账、per-tier 在途计数
# 不参与（行为与现状逐位一致）。
enabled = false
congestion_threshold = 0.9
alpha_slo = 2.0
alpha_burst = 1.0
alpha_debt = 4.0

# ✅ 热生效 —— 精确响应缓存（ResponseCache 每次操作从热配置现读）
# - enabled: 缓存开关。**默认 false**——TTL 内响应陈旧是产品语义，上线由运维
#   显式打开。
# - ttl_secs: 缓存 TTL（秒），默认 300。
# 仅确定性请求参与：stream==false && tools 为空 && temperature==0 或缺省；
# 请求头 X-No-Cache: 1 强制回源；命中响应带 X-Cache: HIT，未命中 MISS。
# 键 = resp:{api_key_sha256}:{vendor}:{model}:{sha256(canonical_body)}，调用方
# API key 哈希入键做租户隔离；存储落地 oxcache 内存后端。
[cache]
enabled = false
ttl_secs = 300
# TTL 负载联动：**默认 false = 纯静态 TTL**（与现状逐位一致）。开启时实际
# TTL = ttl_secs × 类别乘数 × (1 + λ·(β_max−1))，其中
# λ = min(1, (L_p/L_target)·w_L + (Q/Q_target)·w_Q)——L_p 取该 vendor 的
# ewma_e2e_ms（口径降级：论文为 P95 分位，本实现用 EWMA 均值替代，高估方向
# 安全）；Q 取该 vendor 的 60s 流量份额。冷 vendor（无观测）λ=0 不惩罚
# 冷启动。
ttl_load_linked = false
w_l = 0.0
w_q = 0.0
# 负载放大上限（λ=1 时 TTL = base×β_max）；配置 <1 按 1 处理（只放大不缩短）
beta_max = 1.5
# 延迟目标（毫秒，ewma_e2e_ms 口径）：达到该值时延迟项满权重
l_target = 1000.0
# 流量份额目标（0..1）：达到该值时份额项满权重
q_target = 0.5
# TTL 抖动系数（**默认 0 = 关闭，保持精确 TTL**）。>0 时写入 TTL 按对称抖动
# ttl×(1±factor)（与 oxcache apply_jitter 同口径），同批键过期不齐峰。
ttl_jitter = 0.0
# 空响应负缓存窗口（秒，默认 60）：store() 收到 Null 响应时写哨兵而非值，
# 窗口内 check() 直接 Hit(Null) 不再穿透上游。
null_cache_ttl_secs = 60
# 类别乘数表（可选）：按 model_id 前缀匹配首条命中，无命中乘数 1.0；与负载
# 联动开关独立生效。示例（按需取消注释）：
# [[cache.categories]]
# model_id_prefix = "gpt-4"
# multiplier = 2.0

# ❌ 需重启 —— 语义响应缓存 `[cache.semantic]`（`semantic-cache` feature 门控，
# 默认关）：精确缓存 miss 后按 BGE 嵌入余弦相似检索（强制租户隔离，检索域限同
# api_key_hash）。语义层在 bootstrap 装配一次（enabled 时加载 BGE 模型），热更新
# 不重装配——启用/停用与参数变更均需重启；BGE 加载失败 → 语义层旁路 + ERROR
# 日志限频，精确缓存不受影响。
# - enabled: 语义缓存开关，**默认 false**（完全旁路，行为与历史逐位一致）。
# - similarity: 余弦相似度命中阈值 ∈ (0,1]，默认 0.92。
# - max_entries: 向量条目容量上限（FIFO 逐出），默认 1000。
# - model_path: BGE embedding 模型目录名（vecboost models/ 下），默认 "BAAI-bge-small-zh-v1.5"。
[cache.semantic]
enabled = false
similarity = 0.92
max_entries = 1000
model_path = "BAAI-bge-small-zh-v1.5"

# ✅ 热生效 —— 词法压缩 `[lexcompress]`（training-free 确定性剪枝）：仅请求带
# `X-Compress: 1` 且单条消息超阈值的请求生效（命中响应带 X-Compressed: 1）。
# - enabled: 压缩开关。**默认 false = 完全旁路**（行为与历史逐位一致）。
# - min_chars: 单条消息触发压缩的最小字符数，默认 4000。
# - ratio_ceiling: 压缩比例上限（最多压掉的比例，0.5 = 结果至少保留一半），默认 0.5。
[lexcompress]
enabled = false
min_chars = 4000
ratio_ceiling = 0.5

# ✅ 全字段请求期热读 —— OpenAI Responses API（/v1/responses）。
# 默认转成统一 chat IR 后进入现有路由池；有状态能力由网关侧
# response_store 表（迁移 V4）承担。
# - enabled: 端点总开关；false 时 POST/GET/DELETE/cancel 一律 404
# - store_enabled: 是否允许落库；false 时 store=true 请求按 store=false
#   降级并在响应回显
# - retention_hours: 存储保留时长（1-8760 小时，默认 720 = 30 天）
# - max_response_bytes: 单列 JSON 上限（1024-16777216 字节），超限拒绝写入
# - background_enabled / max_background_jobs: 后台任务开关与并发上限
#   （1-256，热读；超限 429）
[responses]
enabled = true
store_enabled = true
retention_hours = 720
max_response_bytes = 1048576
background_enabled = true
max_background_jobs = 16

# ❌ 需重启 —— gRPC Server（feature = "grpc"）— sdforge grpc 门面
#（sdforge.v1.SdForgeService）。GrpcServerConfig 固化于服务器构造，更新后需
# 重启进程生效。本段缺席或 enabled = false 时 gRPC 服务器完全禁用（不监听
# 50051，行为与历史逐位一致）。开启方式：cargo build --features grpc。
# - port: gRPC 监听端口（50051 为 gRPC 惯例端口）。
# - timeout_seconds: per-call 超时（秒），0 = 不限；默认 30。
# - max_connections: 每连接并发上限；0 = tonic 默认；默认 1000。
# - http2_keepalive_interval_secs / http2_keepalive_timeout_secs: HTTP/2
#   keepalive 探测间隔/超时（秒），缺席 = tonic 默认。
# 认证：门面调用（Call/CallStream/GetInfo）经 auth_verifier 校验，复用
# [auth] 段 SHA256 摘要 + 常量时间比较（语义对齐 HTTP 中间件；与 HTTP
# /health 白名单的差异：gRPC 侧无 method 白名单，一律要求 key）。
# TLS 不经 sdforge 终结（明文监听，由外部反代承担），与 [server] 同策略。
[grpc]
enabled = false
host = "0.0.0.0"
port = 50051
timeout_seconds = 30
max_connections = 1000
http2_keepalive_interval_secs = 30
http2_keepalive_timeout_secs = 10

# ❌ 需重启 —— OpenAPI/Swagger UI 出口。enabled = false（默认）时 /api-docs
# 与 Swagger UI 路由不存在（404）；运维显式打开后可达（静态文档面，免认证
# 免限流——开关本身即访问门）。路由建站期固化，改动触发热重载拒绝。
[docs]
enabled = false

# ✅ enabled / 权重 / 配额即时热生效（vendor 实例拓扑增删需重启）
# 上游密钥持久化（key-vault）：除 env 外，密钥可经 POST /admin/vault/keys 录入保密柜
# （cocoon AEAD 加密入库，首装时 env 值自动吸收、之后免二次输入）。主钥来源：
#   1. env FLUXGATE_MASTER_KEY（64 位 hex = 32 字节；服务器/容器推荐）
#   2. 缺失时自动生成主钥文件：默认 ~/.fluxgate/vault_master.key（Unix 0600），
#      路径可由 env FLUXGATE_MASTER_KEY_FILE 覆盖——容器部署必须指向持久卷
#      （compose 已指向 /app/data/vault_master.key），否则容器重建后新主钥解不开
#      既有密文，启动即 fail-fast 重启循环。
# ⚠ 主钥丢失则柜内密钥不可恢复，请备份主钥文件或妥善保管 env 值。
# 上游密钥只从环境变量读取（api_key_env / api_key_envs 存的是 env 名，
# 绝不存 key 原文）。
[[vendors]]
id = "openai"
name = "OpenAI"
type_ = "openai"          # openai | anthropic | gemini | rerank（协议方向与转换器选型；其余值按 OpenAI 兼容面处理，代码不校验取值。注意：embedding 是条目 model_type 任务值，非厂商 type_ 协议值）
api_key_env = "OPENAI_API_KEY"
# 可选：多 key 池——显式 env 名列表，与 api_key_env 合并去重（本列表在前），
# 按序轮换出站 key；401/403 认证失败自动切换下一把（生效于下次请求）。缺
# env 的名跳过并告警；池空回退 api_key_env 单 key。
# api_key_envs = ["OPENAI_API_KEY_2", "OPENAI_API_KEY_3"]
# ✅ 热生效 —— 出站自定义头（静态附加头，string→string，不做模板替换）：
# 随每个上游请求统一注入（出站构造每请求现读，改后下一请求即用新值）；
# 与网关已设置的头（Authorization/x-api-key/Content-Length/Host 等鉴权与
# 协议头）同名时跳过该项并记 warn，不覆盖。默认空表（零行为变化）。
# （行为以实现为准——早期「需重启」标注不实，见 CHANGELOG 评审修复条目。）
# extra_headers = { "x-tenant-id" = "acme", "x-trace-namespace" = "prod" }
# 非标参数门控（仅 type_ = "openai" 的转换出站）：**默认 false**——转换出站
# 剥离非 OpenAI 标准参数 `top_k`（记 debug 显性化）；置 true 原样发送。
# 同协议零拷贝透传路径恒不剥离（字节保真）。
# send_nonstandard_params = false
api_base = "https://api.openai.com/v1"
enabled = true
# fallback 优先级：数值越小越优先（1 = primary；换路 fallback 链按此构建）
priority = 1
# 支持 batch 端点标记（X-Batch: 1 路由的过滤标记）：**默认 false**——标记且
# 候选集含本厂商时收缩候选集（空集则忽略标记）。
supports_batch = false
# chat 端点路径覆盖（如 Zhipu 类厂商用 "/chat/completions" 而非默认的
# "/v1/chat/completions"）：设置后出站 URL = api_base + 该路径，跳过 /v1 自动
# 拼接规则；None/缺省 = 走历史规则。示例（按需取消注释）：
# chat_path = "/chat/completions"
# 端点风格（仅 type_ = "openai" 合法，与 chat_path 互斥）：
# - "chat"（缺省）：出站 chat/completions
# - "responses"：出站 /responses（OpenAI Responses API）；入站
#   /v1/responses 的原生能力（内置工具/background/prompt/文件输入）也只
#   允许该类厂商承接。示例（按需取消注释）：
# api_style = "responses"
# 出站三层超时模型，**0 = 对应层不限时（逃生阀）**：
# - timeout_ms: 非流式请求 per-attempt 总超时（从 send 发起起算至响应体读完，
#   不含本地排队；每次重试独立计时）。默认 60000
# - stream_ttft_ms: 流式首包（TTFT）超时——send 发起至上游响应头返回；首包
#   返回后愿意继续等（Cloudflare 口径）。默认 60000
# - stream_idle_ms: 流式 chunk 间 idle 超时（相邻上游字节块最大间隔，超时以
#   Timeout 终止流）。默认 30000；慢生成流（分块间隔可能超 30s 的长思考型
#   模型）请调大或以 0 关闭
# 长思考型模型同样建议调大 timeout_ms/stream_ttft_ms 或以 0 关闭
timeout_ms = 60000
stream_ttft_ms = 60000
stream_idle_ms = 30000
# 并发与配额票据：
# - requests_per_second: 出站速率上限
# - max_concurrent_requests: 最大并发在途请求数（含流式，流式 permit 持有至
#   流结束）。缺省 = 使用队列容量（100），按需显式填写：
#   concurrency = { requests_per_second = 100, max_concurrent_requests = 50 }
# - token_weighted: token 加权并发票据（**默认 false = 单票据现状**）。开启时
#   并发票据按预估 token 量计费（cost = clamp(messages 序列化字节/4 +
#   max_tokens, token_ticket_min, token_ticket_max)，max_tokens 缺省按
#   token_ticket_default=4096 兜底）——agentic 长会话不再与短请求等价占票；
#   load_signal = "in_flight" 的信号同步变 token 加权口径。restart-required
#  （vendor 实例构造期消费）。票据饥饿为机制内生风险，token_ticket_max 为
#   逃逸阀。
concurrency = { requests_per_second = 100, token_weighted = false, token_ticket_min = 1, token_ticket_max = 16384, token_ticket_default = 4096 }
# 配额限流三形态（type 标签）：
# - { type = "token", max_tokens = N, window_hours = 24, sliding = false }
#   window_hours 缺省 24h；窗口由 limiteron FixedWindowLimiter 惰性重置
# - { type = "interval", hours = 1, sliding = false }
# - { type = "time_window", start = "09:00", end = "18:00" }
# sliding = true 换 limiteron ShardedSlidingWindowLimiter（消除固定窗口翻越点
# 的瞬时 2× 配额双花；reset_secs 以窗口全长为近似上界）。**缺省 false =
# 固定窗口现状**。
rate_limit = { type = "token", max_tokens = 10000000, window_hours = 24, sliding = false }

# 模型条目：weight 参与路由加权第 1 维；abstract_id 为抽象模型名（客户端用
# 抽象名请求时按此匹配候选，缺省 = 只认 model_id）。GET /v1/models 也列这个
# 公开名：声明 abstract_id 后，裸 model_id 不再是请求名（限定形式
# "vendor.model_id" 仍可路由），清单不会给出回投即 400 的 id。
# 唯一性：vendor id 全局唯一、同 vendor 内 model_id 唯一，去重按 ASCII 大小写
# 不敏感（仅差大小写的重复条目加载即拒）。
# 嵌入条目：声明 dimensions 或 compat_group 任一的条目 = 嵌入条目，`POST
# /v1/embeddings` 按「兼容组粘着」路由（chat 主路由不读这两个字段）：
# - dimensions: 上游声明维度。仅用于同组内一致性校验与响应维度守门基准
#   （首见响应记录，后续不一致 502 拦截），不影响路由选择。
# - compat_group: 兼容组名（trim 后非空）。同组条目共享同一向量空间、故障时
#   允许组内迁移；未声明 = 单例组（安全默认：不与其他厂商互换，故障显式报错
#   而非静默换家）。组名不得跨 abstract_id（R3），同组 model_id 必须一致
#   （R1，大小写不敏感），同组已声明的 dimensions 必须相等（R2）。
# - model_type: 条目任务类型 chat / embedding / rerank（缺省 = chat）。显式声明
#   优先于 dimensions/compat_group 的嵌入推断；rerank 路由按
#   type_ = "rerank" + model_type = "rerank" 双维度过滤候选（其余候选显式拒绝）。
# 示例（同组条目在各自 vendor 下声明相同的 model_id 与组名）：
# [[vendors.models]]
# model_id = "text-embedding-3-small"
# abstract_id = "text-embedding-small"
# enabled = true
# weight = 1.0
# dimensions = 1536
# compat_group = "openai-embedding-v1"
#
# ---- 重排（Rerank）厂商示例（Cohere / Jina / TEI 等同形状上游）----
# type_ = "rerank" 必须显式 api_base（无官方默认端点），出站固定
# POST {api_base}/rerank + Authorization: Bearer；条目必须声明
# model_type = "rerank"（条目级能力位缺失时不会被 rerank 路由选中）。
# [[vendors]]
# id = "cohere-prod"
# name = "Cohere Rerank"
# type_ = "rerank"
# api_key_env = "COHERE_API_KEY"  # pragma: allowlist secret（示例环境变量名，非凭证）
# api_base = "https://api.cohere.com/v1"   # Jina: https://api.jina.ai/v1；TEI: http://host:port
# [[vendors.models]]
# model_id = "rerank-v3.5"
# abstract_id = "rerank-v3"
# model_type = "rerank"
# enabled = true
# weight = 1.0
[[vendors.models]]
model_id = "gpt-3.5-turbo"
enabled = true
weight = 1.0

[[vendors.models]]
model_id = "gpt-4"
enabled = true
weight = 1.0
# abstract_id = "chat-basic"

[[vendors]]
id = "anthropic"
name = "Anthropic"
type_ = "anthropic"
api_key_env = "ANTHROPIC_API_KEY"
# ✅ 热生效 —— 出站自定义头（语义同上，默认空表）：
# extra_headers = { "x-tenant-id" = "acme" }
# Anthropic 版本头 `anthropic-version`（出站注入；缺省 None → "2023-06-01"；
# 格式 YYYY-MM-DD，非法值加载即拒 config 错误）：
# anthropic_version = "2023-06-01"
# 转发入站 `anthropic-beta` 头（**默认 false**）：开启后转换与透传两条路径
# 均把入站值原样注入出站；仅 ASCII 可见字符且长度 ≤ 4096 的值被采纳
#（非法值丢弃并 warn）。
# forward_beta_headers = false
api_base = "https://api.anthropic.com/v1"
enabled = true
priority = 2
# 出站三层超时（语义与 0=禁用约定同上）
timeout_ms = 60000
stream_ttft_ms = 60000
stream_idle_ms = 30000
# 并发与配额（token_weighted / window_hours / sliding 语义同上）
concurrency = { requests_per_second = 100, token_weighted = false, token_ticket_min = 1, token_ticket_max = 16384, token_ticket_default = 4096 }
rate_limit = { type = "token", max_tokens = 10000000, window_hours = 24, sliding = false }

[[vendors.models]]
model_id = "claude-3-opus-20240229"
enabled = true
weight = 1.0

# ---- Gemini 原生厂商（type_ = "gemini"）----
# 出站固定 {api_base}/v1beta/models/{model}:generateContent|
# streamGenerateContent?alt=sse；鉴权头 x-goog-api-key；api_base 可省略（缺省
# https://generativelanguage.googleapis.com）。不得声明 chat_path（端点由
# model + action 动态拼接）；api_style 仅允许缺省或 "chat"。
# 入站同时提供 /v1beta/models/{model}:{action} 原生端点（generateContent /
# streamGenerateContent / countTokens / embedContent / batchEmbedContents）；
# safetySettings/cachedContent/内置工具仅路由本类型厂商。
[[vendors]]
id = "gemini"
name = "Google Gemini"
type_ = "gemini"
api_key_env = "GEMINI_API_KEY"  # pragma: allowlist secret（示例环境变量名，非凭证）
# api_base = "https://generativelanguage.googleapis.com"
enabled = true
priority = 3
timeout_ms = 60000
stream_ttft_ms = 60000
stream_idle_ms = 30000
concurrency = { requests_per_second = 50, token_weighted = false, token_ticket_min = 1, token_ticket_max = 16384, token_ticket_default = 4096 }
rate_limit = { type = "token", max_tokens = 10000000, window_hours = 24, sliding = false }

[[vendors.models]]
model_id = "gemini-2.5-pro"
enabled = true
weight = 1.0
# abstract_id = "gemini-pro"

# ---- 本地示例/联调用 mock 厂商（按需整段取消注释，生产保持注释）----
# examples/ 的请求以 vendor_hint = "mock-openai" 与模型名 gpt-4 /
# claude-3-opus / text-embedding-3-small 指向本地上游桩（OpenAI/Anthropic
# 兼容，缺省 http://127.0.0.1:8001/v1；容器部署把 api_base 的 127.0.0.1
# 换成 host.docker.internal，compose 已映射）。生产部署保持注释：mock
# 厂商入池会参与 fallback 链，可能接住生产流量。
# [[vendors]]
# id = "mock-openai"
# name = "Mock OpenAI"
# type_ = "openai"
# api_key_env = "MOCK_OPENAI_API_KEY"
# api_base = "http://127.0.0.1:8001/v1"
# enabled = true
# priority = 9
# timeout_ms = 60000
# stream_ttft_ms = 60000
# stream_idle_ms = 30000
# concurrency = { requests_per_second = 100, token_weighted = false, token_ticket_min = 1, token_ticket_max = 16384, token_ticket_default = 4096 }
# rate_limit = { type = "token", max_tokens = 10000000, window_hours = 24, sliding = false }
# [[vendors.models]]
# model_id = "gpt-4"
# enabled = true
# [[vendors.models]]
# model_id = "claude-3-opus"
# enabled = true
# [[vendors.models]]
# model_id = "text-embedding-3-small"
# enabled = true

# 全局模型池：model = "auto" 的选路目标（抽象/直连两级都未命中时才尝试）。
# enabled = false 时 auto 档以 validation_error(400) 拒绝（显式模型名不受影响）；
# 缺本段 = 启用（沿用历史兜底）。strategy 为档位声明，当前选路由 [routing] 决定。
[global_model]
enabled = true
strategy = "weighted"

# ✅ 热生效 —— 价格表：vendor + model 维度的输入/输出 token 单价
# （每 1k tokens，USD）。注意与 [[model_catalog]] 的「每 1M tokens」口径不同。
# 未配置 [[pricing]] 时 CostCalculator 全部返回 0.0；本表同时是 SLA 打分项
#（[routing].sla_v > 0）的成本输入。
[[pricing]]
vendor_id = "openai"
model_id = "gpt-4"
input_per_1k_tokens = 0.03
output_per_1k_tokens = 0.06

[[pricing]]
vendor_id = "anthropic"
model_id = "claude-3-opus-20240229"
input_per_1k_tokens = 0.015
output_per_1k_tokens = 0.075
