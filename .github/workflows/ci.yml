#===============================================================================
# Fluxweir CI 质量门禁（对齐 confers 7 仓库统一基线）
# fmt / clippy / check / test / build / doc / coverage / security
# （特性全量矩阵见 feature-matrix.yml，CodeQL 见 codeql.yml.disabled）
#
# 与 confers 基线的差异：
#   - 自研 7 库经 crates.io registry 集成（版本写在 Cargo.toml、校验和锁在
#     Cargo.lock），各 cargo 作业直接拉取，无兄弟库克隆步骤；
#   - 本仓库有 Criterion 基准（conversion / sse / routing / affinity，见
#     docs/PERFORMANCE.md），但**不在 CI 跑**（时长与资源权衡，基线人工复跑
#     对照）；deny.toml 存在，security 作业仍只跑 cargo audit——
#     cargo deny check 的接入见该作业注释；
#   - CodeQL 为停用态：私有仓未启用 GHAS，SARIF 上传必被 API 拒绝——workflow
#     保留为 .github/workflows/codeql.yml.disabled，转 public / 启用 GHAS 后
#     重命名启用；
#   - 特性组合：本作业只跑手写组合矩阵（default / 两后端 / 单特性三组合 /
#     nightly 全特性 web-search + subscription-vendor），逐特性全量矩阵在
#     feature-matrix.yml（每周定时 + 手动触发）；
#   - build / doc 按本仓特性面适配：`--all-features` 因 db-* 互斥不可用，
#     build 改「默认 + 零特性」两口径，doc 只跑默认口径；
#   - 无 docker 作业：镜像可独立构建（纯 registry 依赖，不取兄弟库源码），
#     镜像构建与扫描仍未纳入 CI。
#===============================================================================
name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  # 每日安全扫描：仅 security 作业响应 schedule，其余作业跳过
  schedule:
    - cron: "37 5 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_VERSION: "1.97"
  # ↑ MSRV 下限工具链：与 Cargo.toml 的 rust-version = "1.97.1" 对齐（"1.97"
  #   解析到当前最新 patch 1.97.1）。按 MSRV 跑 build/clippy 同时两个目的：
  #   守住兄弟库下限、让 clippy  lint 集合可复现（clippy 随工具链版本变化）。
  #   docker/Dockerfile 与 release.yml 用当前 stable（1.99），高于下限即可

jobs:
  #-----------------------------------------------------------------------------
  # 格式检查
  #-----------------------------------------------------------------------------
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 只读 token 不落盘（.git/config）
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  #-----------------------------------------------------------------------------
  # Clippy 零告警
  #-----------------------------------------------------------------------------
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 只读 token 不落盘（.git/config）
          persist-credentials: false
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # db-* 三组互斥由 dbnexus 编译期守卫强制（db-backend-selection），
      # --all-features 同时打开三个后端必然编译失败——clippy 跑 default 口径
      # （full + db-sqlite），非 default 后端组合由 check/test 的特性矩阵覆盖
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # 示例集单 crate 的 grpc 模块不在 default（保留「普通构建不需 protoc」的
      # 隔离），--all-targets 的 default 口径会跳过 grpc bin——显式补一条 grpc
      # feature 的 clippy，覆盖代码生成与 grpc_client 模块 lint（此作业已装 protoc）
      - name: Run clippy (examples grpc feature)
        run: cargo clippy -p fluxweir-examples --no-default-features --features grpc --all-targets -- -D warnings
      # 非默认 feature 面的 lint 腿：feature-matrix.yml 每周只跑 cargo hack check
      # （仅编译性、无 clippy），「单独开启才编译」的 feature 其 lint 从未被门禁
      # （masking/catalog-sync 曾积 lint 债，codenexus-audit-remediation 清零）。
      # 本腿每 PR 防复辟，覆盖全部 runner 可解析的非默认面（含 otlp——test 作业
      # 只编译不 lint，三维审查 M1 补齐口径）。difficulty-classifier 与
      # semantic-cache 排除：二者均 dep:vecboost，是 sibling path 依赖（../vecboost）
      # 且 rc.3 未发 crates.io，runner 上不存在（同 feature-matrix.yml 排除理由；
      # 三维审查 H-1 修正——本地预演因本机存在 ../vecboost 而通过，属环境差异盲点）
      - name: Run clippy (non-default feature surfaces)
        run: cargo clippy -p fluxweir --features "masking,catalog-sync,otlp,grpc" --all-targets -- -D warnings

  #-----------------------------------------------------------------------------
  # 编译检查（默认特性 / 三后端特性矩阵）
  #-----------------------------------------------------------------------------
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 只读 token 不落盘（.git/config）
          persist-credentials: false
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check default features
        run: cargo check --workspace
      # 示例 grpc 模块非 default（protoc 隔离），显式补一条编译校验
      # （此作业已装 protoc）
      - name: Check examples grpc feature
        run: cargo check -p fluxweir-examples --no-default-features --features grpc
      # --all-features 会同时启用互斥的 db-* 三组（dbnexus 守卫必触发），
      # 改为按后端逐一检查；db-sqlite 已由 default 覆盖
      - name: Check db-postgres features
        # -p 限定到本包：workspace 形态会把示例成员的 default db-sqlite 拉入
        # 特性联合，dbnexus 互斥守卫必触发（与 README 本地校验口径逐字一致）
        run: cargo check -p fluxweir --no-default-features --features "full,db-postgres"
      - name: Check db-mysql features
        run: cargo check -p fluxweir --no-default-features --features "full,db-mysql"
      # 单特性组合回归网：database/web-server 的隐式前提（logging/infrastructure）
      # 若被拆掉，这两条立即编译失败（矩阵口径见 tests/matrix/feature_matrix.rs）
      - name: Check single-feature combos
        run: |
          cargo check -p fluxweir --no-default-features --features "database,db-sqlite"
          cargo check -p fluxweir --no-default-features --features "web-server,db-sqlite"
          cargo check -p fluxweir --no-default-features --features "logging,db-sqlite"
          # cost-replay 不进 full：默认面既不编译库模块也不编译独立 bin
          cargo check -p fluxweir --no-default-features --features "cost-replay,db-sqlite"
          # router 必须脱离 web-server 独立成形（嵌入式消费方的实际组合；
          # 历史缺陷：router 曾直接引用 middleware，此组合长期不可编译）
          cargo check -p fluxweir --no-default-features --features "vendor-management,router,protocol,resilience"

  #-----------------------------------------------------------------------------
  # 测试（mockito 自包含，无外部服务依赖）
  #-----------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 只读 token 不落盘（.git/config）
          persist-credentials: false
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # --all-features 因 db-* 互斥不可用（同 check 注释）；测试跑 default
      # 口径（full + db-sqlite，mockito 自包含）
      - name: Run tests
        run: cargo test --workspace
      # otlp / masking 等非默认特性不进 full：默认口径的 cargo test 不会
      # 编译它们，模块里的缺陷会静默合入。此步单独编译并跑这些特性的测试。
      - name: Run feature-gated tests (otlp)
        run: cargo test --features otlp,db-sqlite
      # cost-replay 同样不进 full（独立 bin + 回放引擎），默认口径下
      # `cargo test --workspace` 零编译、零执行；单列一步跑引擎单测 + CLI 集成测试。
      - name: Run feature-gated tests (cost-replay)
        run: cargo test -p fluxweir --no-default-features --features "cost-replay,db-sqlite"

  #-----------------------------------------------------------------------------
  # 全特性回归：不进 full 的合规敏感面（web-search / subscription-vendor / cost-replay）
  # 默认 test/clippy 只编译 default 面，这些特性下的模块缺陷会静默合入
  # （与上一作业单独补 otlp 同理，二者合起来覆盖全部「不进 full」特性）。
  # schedule + workflow_dispatch 触发：不在 PR 门禁上加重编时长，nightly
  # 兜底。default（full + db-sqlite）打底叠加三特性，与本地收口口径一致。
  #-----------------------------------------------------------------------------
  full-features:
    name: Full features (web-search + subscription-vendor + cost-replay)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 只读 token 不落盘（.git/config）
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Run clippy (default + web-search + subscription-vendor + cost-replay)
        run: cargo clippy --features "web-search,subscription-vendor,cost-replay" --all-targets -- -D warnings
      - name: Run tests (default + web-search + subscription-vendor + cost-replay)
        run: cargo test --features "web-search,subscription-vendor,cost-replay"

  #-----------------------------------------------------------------------------
  # 服务端数据库后端的运行时验证（postgres / mysql）
  # 默认 test 作业只接 sqlite；非默认后端的建表迁移与方言 UPSERT 此前只做
  # 编译级 check（ON CONFLICT / ON DUPLICATE KEY UPDATE 从未真实执行）。
  # 本作业起服务容器，用 FLUXWEIR_TEST_DB_URL 驱动 database_test 里
  # `*_server` 的 #[ignore] 用例（affinity V6 亲和 + quota V7 预算账本）。
  #-----------------------------------------------------------------------------
  server-backend:
    name: Server backend (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: postgres
            feature: db-postgres
            image: postgres:16-alpine
            url: postgres://postgres@localhost:5432/postgres
            health_options: >-
              --health-cmd "pg_isready -U postgres"
              --health-interval 5s --health-timeout 5s --health-retries 10
            ports: 5432:5432
          - backend: mysql
            feature: db-mysql
            image: mysql:8.0
            url: mysql://root@localhost:3306/fluxweir_test
            health_options: >-
              --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot"
              --health-interval 5s --health-timeout 5s --health-retries 20
            ports: 3306:3306
    services:
      db:
        image: ${{ matrix.image }}
        env:
          # 一次性 CI 容器：免密本地认证（仓库内不引入任何口令字面量）
          # 专用库：不往 mysql 系统库建表
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: fluxweir_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - ${{ matrix.ports }}
        options: >-
          ${{ matrix.health_options }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # 两腿特性组合不同（db-postgres / db-mysql），默认 key 只含 job id：
          # 同 key 不可覆盖，后保存腿被跳过，两腿 restore 到同一份产物、另一
          # 腿全量重编。key 掺入 matrix.feature 彻底隔离两腿缓存。
          key: ${{ matrix.feature }}
      # 子串过滤器契约：database_test 内所有 #[ignore] 用例命名必含 `server`
      # （tests/guard/ignore_filter_guard.rs 机械校验）。此处先 --list 断言
      # 命中数 ≥2：libtest 过滤器零命中时输出 `0 passed` 且 exit 0，模块
      # 改名/移除后作业会静默虚通过，恰好复辟「方言 UPSERT 从未真实执行」。
      # grep 零命中自身 exit 1，`|| true` 让 0 落进下方显式判空、给出可读报错
      # （否则步骤先以裸 exit 1 中断，::error 提示永不触达）
      - name: Assert server filter matches expected tests
        run: |
          count=$(cargo test -p fluxweir --no-default-features \
            --features "full,${{ matrix.feature }}" \
            --test database_test server -- --ignored --list | grep -c ': test$' || true)
          echo "server filter matched: $count test(s)"
          if [ "$count" -lt 2 ]; then
            echo "::error::server 过滤器仅命中 ${count} 个用例（预期 ≥2），过滤器契约失效"
            exit 1
          fi
      # 只跑服务端方言相关用例（迁移建表 / UPSERT 冲突 / 读取 / 清理）。
      # --test-threads=1：两个用例各自 initialize() 同一共享实例，且测试
      # 模块自约「单函数串行防并行互染」（database_test.rs 模块文档）——
      # 并行会让迁移重放 / 索引探针的 DDL 竞态偶发红
      - name: Run server-backend dialect tests
        env:
          FLUXWEIR_TEST_DB_URL: ${{ matrix.url }}
        run: |
          cargo test -p fluxweir --no-default-features \
            --features "full,${{ matrix.feature }}" \
            --test database_test server -- --ignored --test-threads=1 --nocapture

  #-----------------------------------------------------------------------------
  # 三平台编译（跨平台约束的 CI 落点）
  # 默认特性（full + db-sqlite）经 bundled sqlite 静态编译（libsqlite3-sys
  # 的 cc 构建 C 源），三平台均无系统库前置；grpc 不在默认面，无需 protoc。
  # 默认图另含 aws-lc-sys（rustls 后端），其 C 构建需 cmake（Windows 另需
  # NASM）——GH runner 镜像自带，无需额外安装
  #-----------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # 超时按实测留 5~6 倍余量（冷编约 92s + checkout/工具链/缓存开销；
    # windows 编译与链接更慢），把单腿挂死的尾部成本压住
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 30 || 20 }}
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 只读 token 不落盘（.git/config）
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: cross-${{ runner.os }}
      # --all-features 因 db-* 互斥不可用（同 check 注释），改「默认 + 零特性」
      # 两口径；二者均已本机验证通过
      - name: Build (default features)
        run: cargo build --workspace
      - name: Build (no default features)
        run: cargo build --workspace --no-default-features

  #-----------------------------------------------------------------------------
  # 文档构建（零警告：断链、私有项链接、无效 HTML 一并拦下）
  #-----------------------------------------------------------------------------
  doc:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 只读 token 不落盘（.git/config）
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build documentation (zero warnings)
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  #-----------------------------------------------------------------------------
  # 覆盖率（生成 + 上传 Codecov）
  # 注意：暂不设 --fail-under-lines 门禁——首次测量前不知道真实基线，
  # 先采集数据，基线明确后再按 confers 基线加 ≥80% 行覆盖率门禁。
  #-----------------------------------------------------------------------------
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 只读 token 不落盘（.git/config）
          persist-credentials: false
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage
        # --all-features 因 db-* 互斥不可用（同 check 注释）；覆盖率按 default
        # 口径采集，与 test job 一致。基线 2026-10-15 实测 94.70%，本变更补测后
        # ≥95%，以 --fail-under-lines 95 锁定（低于即 job 失败）
        run: cargo llvm-cov --workspace --lcov --fail-under-lines 95 --output-path lcov.info
      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          fail_ci_if_error: false

  #-----------------------------------------------------------------------------
  # 供应链安全（每日 schedule 唯一响应者；cargo audit 只读 Cargo.lock，
  # 无需编译）
  #-----------------------------------------------------------------------------
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 只读 token 不落盘（.git/config）
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Install cargo-audit
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit
