[package]
name = "nexusflow"
version = "0.1.0"
edition = "2021"
description = "智能 LLM 路由代理系统 - 多厂商统一管理、格式转换、智能调度"
authors = ["NexusFlow Contributors"]

[lib]
path = "src/lib.rs"

[features]
default = ["full"]
full = ["web-server", "database", "vendor-management", "router", "protocol", "infrastructure", "sdforge-integration", "logging"]
web-server = ["dep:axum", "dep:tower", "dep:tower-http", "dep:async-stream"]
database = ["dep:dbnexus", "dep:sea-orm"]
vendor-management = ["dep:reqwest", "dep:async-channel", "dep:limiteron"]
router = []
protocol = []
infrastructure = ["dep:oxcache", "dep:confers", "dep:trait-kit"]
sdforge-integration = ["dep:sdforge"]
logging = ["dep:inklog"]

[dependencies]
# Web 框架
axum = { version = "0.8", features = ["macros"], optional = true }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.7", features = ["cors", "trace", "request-id"], optional = true }

# 数据库
dbnexus = { version = "0.3", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "permission", "sql-parser", "macros", "config-env", "with-time"], optional = true }
sea-orm = { version = "2.0.0-rc.42", default-features = false, optional = true }

# 日志
inklog = { version = "0.1", default-features = false, features = ["http", "cli", "sqlite"], optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", optional = true }

# 流控
limiteron = { version = "0.2", default-features = false, features = ["tower-middleware", "ban-manager", "circuit-breaker", "gcra", "quota-control"], optional = true }

# 缓存
oxcache = { version = "0.3", default-features = false, features = ["minimal", "macros"], optional = true }

# 配置
confers = { version = "0.4", default-features = false, features = ["toml", "env", "watch", "validation"], optional = true }

# DI
trait-kit = { version = "0.3", default-features = false, features = ["async"], optional = true }

# SDK 框架
sdforge = { version = "=0.3.4", default-features = false, features = ["http", "security", "streaming"], optional = true }

# 序列化与核心
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
futures = "0.3"
futures-util = "0.3"
tokio-util = "0.7"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
once_cell = "1"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
bytes = "1"
reqwest = { version = "0.13", features = ["json", "stream", "socks"], optional = true }
async-channel = { version = "2", optional = true }
async-stream = { version = "0.3", optional = true }
sys-info = "0.9"
toml = "1"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.15"
mockall_double = "0.3"
http-body = "1.0"
futures-util = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
