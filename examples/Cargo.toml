[package]
name = "nexusflow-examples"
edition = "2021"
publish = false
# bin 全部经显式 [[bin]] 声明（带 required-features），关闭自动发现避免同名 target 冲突
autobins = false

[features]
# default 覆盖 rest + embedded + sdk：与拆分前 `cargo check --workspace` 的编译面
# 等价（embedded 拉 nexusflow full+db-sqlite、rest/sdk 各自依赖），grpc 刻意不入
# default 以保留「普通构建不需 protoc」的隔离（见根 Cargo.toml grpc feature 注释）。
default = ["rest", "embedded", "sdk"]
# rest：裸 HTTP 直连，不依赖 nexusflow 本体
rest = ["dep:anyhow", "dep:futures-util", "dep:reqwest"]
# embedded：库形态嵌入，需 nexusflow 完整装配（full）+ 一个后端（与拆分前 embedded-server
# 继承 default 的 full+db-sqlite 逐位一致）
embedded = ["dep:nexusflow", "dep:axum", "nexusflow/full", "nexusflow/db-sqlite"]
# sdk：HTTP 客户端门面，只开 nexusflow sdk feature——default-features=false 保证
# `--no-default-features --features sdk` 的轻量构建不把网关服务器拖进来（对齐拆分前
# sdk-usage 的 default-features=false, features=["sdk"]）
sdk = ["dep:nexusflow", "nexusflow/sdk"]
# grpc：tonic 客户端，不依赖 nexusflow 本体；仅拉客户端运行时依赖，代码生成见 build.rs
grpc = ["dep:tonic", "dep:tonic-prost", "dep:prost"]

[dependencies]
# 跨示例共享，非 optional（体积可控，且 rest/embedded/sdk 至少各需其一）
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
futures = { version = "0.3", default-features = false, features = ["std"] }

# 按示例门控：保住「轻 sdk 构建 / rest 不拖网关 / grpc 不引 nexusflow」的既有依赖足迹
anyhow = { version = "1", default-features = false, features = ["std"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"], optional = true }
axum = { version = "0.8", default-features = false, features = ["macros"], optional = true }
# default-features=false：由 embedded/sdk 各自精确开启，避免 full 被无条件并入 sdk 构建
nexusflow = { path = "..", default-features = false, optional = true }
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen"], optional = true }
tonic-prost = { version = "0.14", default-features = false, optional = true }
prost = { version = "0.14", default-features = false, features = ["derive"], optional = true }

[build-dependencies]
# build.rs 无条件参与编译（即便 grpc 关闭也会编译 build.rs 源码，只是不在其中运行 protoc），
# 故代码生成器须非 optional。代价：examples 任何构建都会编译 tonic-build/tonic-prost-build
#（不触发 protoc），远小于把 grpc 拆成独立 crate 的维护成本。
tonic-build = { version = "0.14", default-features = false }
tonic-prost-build = { version = "0.14", default-features = false }

# 八个 bin 入口点全部保留；required-features 让未被启用特性覆盖的 bin 在对应构建中被跳过。
[[bin]]
name = "rest_http"
path = "src/bin/rest_http.rs"
required-features = ["rest"]

[[bin]]
name = "standalone"
path = "src/bin/standalone.rs"
required-features = ["embedded"]

[[bin]]
name = "mount_router"
path = "src/bin/mount_router.rs"
required-features = ["embedded"]

[[bin]]
name = "chat"
path = "src/bin/chat.rs"
required-features = ["sdk"]

[[bin]]
name = "stream_chat"
path = "src/bin/stream_chat.rs"
required-features = ["sdk"]

[[bin]]
name = "embed"
path = "src/bin/embed.rs"
required-features = ["sdk"]

[[bin]]
name = "admin"
path = "src/bin/admin.rs"
required-features = ["sdk"]

[[bin]]
name = "grpc_client"
path = "src/bin/grpc_client.rs"
required-features = ["grpc"]
