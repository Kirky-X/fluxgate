# Dependabot 配置 — 7 仓库统一基线(见 base/CONFIG_BASELINE.md，与 confers 保持一致)
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # Rust 依赖更新(Cargo.toml / Cargo.lock)— 包根
  # 注：7 个自研库（confers / dbnexus / inklog / limiteron / oxcache / sdforge /
  # trait-kit）同为 crates.io 依赖，随本生态位一并跟踪版本更新
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      # patch 版本更新合并为单个 PR
      patch-updates:
        update-types:
          - "patch"
      # minor 版本更新合并为单个 PR
      minor-updates:
        update-types:
          - "minor"

  # GitHub Actions 版本更新
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"

  # 基础镜像版本更新（NexusFlow 单仓特有：7 仓基线里只有本仓带 docker/）。
  # 只跟 docker/Dockerfile 的两条 FROM；docker-compose.yml 的 image 是本仓
  # 自建产物，不属版本更新对象。
  # 注：dependabot-core 的 docker 解析器不对 FROM 行做 ARG 展开，所以
  # Dockerfile 里两个基础镜像必须写字面量 tag，否则该生态位完全看不到依赖
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deps"
      include: "scope"
