#===============================================================================
# 智能 LLM 路由代理系统 - Docker Compose 配置
# 支持 SQLite 数据持久化和多环境部署
#===============================================================================

services:
  app:
    build:
      # 构建上下文必须是仓库根：Dockerfile 以 bind mount 绑定 src / Cargo.toml，
      # .dockerignore 也按上下文根解析（保持根目录不动）
      context: ..
      dockerfile: docker/Dockerfile
    container_name: nexusflow-app
    image: nexusflow:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
      - RUST_BACKTRACE=1
      # SQLite 数据库路径 (容器内)
      - DATABASE_URL=/app/data/llm_proxy.db
      # 可选: API Keys (通过环境变量注入)
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      # 配置挂载（只读）：镜像内不含配置文件（.dockerignore 安全排除，
      # main 以第一个 CLI 参数或缺省 config.toml 解析路径）
      - ../config.toml:/app/config.toml:ro
      # SQLite 数据持久化卷
      - nexusflow_data:/app/data
    # 健康检查（实际注册路径带 sdforge 版本前缀：/api/v1/health）
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # 资源限制 (生产环境推荐)
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 512M
        reservations:
          cpus: '0.50'
          memory: 128M
    # 网络配置
    networks:
      - nexusflow_network

#------------------------------------------------------------------------------
# 数据卷 (SQLite 持久化)
#------------------------------------------------------------------------------
volumes:
  nexusflow_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data

#------------------------------------------------------------------------------
# 网络配置
#------------------------------------------------------------------------------
networks:
  nexusflow_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
