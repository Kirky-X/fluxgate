# typos 配置 — 词表白名单（修复 pre-commit 门禁摩擦，对齐 confers/oxcache/trait-kit 做法）
#
# 背景：pre-commit 的 typos 钩子（crate-ci/typos v1.28）默认带 `--write-changes`，
# 命中即原地改写文件。本仓命中项全部为测试夹具与文档图表的有意内容，
# 在此做词级放行；不放宽钩子 args、不删除钩子。
# 干跑核对命令：typos --format brief --exclude out

[default.extend-words]
# 常量时间比较测试夹具（src/middleware/auth.rs）："abd" 与 "abc" 仅差一字节，
# 断言两串不相等——是夹具不是 "and" 的笔误。
abd = "abd"

# 厂商 ID 夹具（tests/vendor/gate_vendor_test.rs）："v-ot" 验证不存在厂商的失败路径。
ot = "ot"

# key_hash 夹具（tests/resilience/admission_test.rs）："ded" 为 Dedicated 档位的
# admit 入账实参，验证 shed 后的记账。
ded = "ded"

# SSE 分帧夹具（tests/protocol/gate_protocol_test.rs）："Hel" 为流式 content 首个分片
# （"Hello" 的截断），断言分片拼回完整文本。
Hel = "Hel"
hel = "hel"

# mermaid 状态节点缩写（docs/ARCHITECTURE.md 熔断状态机 "THR" = Throttled）。
THR = "THR"
thr = "thr"

# masking 大小写敏感性夹具（tests/masking/engine_test.rs）："BaDgE" 验证
# words_any_case 开关——混排大小写是夹具本体，不是 "badge" 的笔误。
Ba = "Ba"

# RFC 4648 base64url 标准测试向量（src/vendor/subscription/oauth.rs）：
# b"fo" → "Zm8" 是 RFC 4648 §10 规范样例，PKCE challenge 实现的验收锚点。
fo = "fo"

# 真实提交哈希（docs/CONTRIBUTING.md 提交规范示例 `4ca8afe`）：
# "afe" 是 SHA 的一段，不是 "safe" 的笔误，改写会损坏哈希。
afe = "afe"

[files]
# out/ 为提交在库的研究报告工具产物（含大量有意缩写与英文笔误），非源码。
extend-exclude = ["out"]
