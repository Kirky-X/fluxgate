[server]
host = "0.0.0.0"
port = 8080

[database]
# 数据库后端为编译期选择（db-backend-selection）：默认构建 = full + db-sqlite
# （本示例即 sqlite 文件库）。PostgreSQL/MySQL 以
#   cargo build --no-default-features --features "full,db-postgres"   # 或 db-mysql
# 构建，并配置完整连接 URL（三组互斥由 dbnexus 编译期守卫强制）：
#   url = "postgres://127.0.0.1:5432/nexusflow"
# url 非空时优先生效；留空则 path 按 sqlite 文件库处理（需 db-sqlite，
# 否则启动报 database-backend-missing 并附重建指引）。
path = "./data/llm_proxy.db"
# url = ""
pool_size = 5

# ---- 模型能力目录（T006）：[[model_catalog]] per-model 条目 ----
# 字段对齐 agentstem ModelEntry；定价单位 =「currency 计价，每 1M tokens」
# （对齐 estimate_usage_cost 口径，T007 计价消费）。无独立计价的缓存档填 0
# （OpenAI 平台不单独计费 cache write）。登记条目 context_window 必须 > 0
# 且 model_id 全局唯一；未登记模型回落 per-flavor 保守默认（openai 128k /
# anthropic 200k / ollama 4096，见 config::model_catalog 文档）。
# capabilities 查询：已登记返回真实值（TUI auto-compact 依赖非 0 窗口）。
# [[model_catalog]]
# model_id = "claude-sonnet-4-20250514"
# context_window = 200000
# input_price = 3.0
# output_price = 15.0
# cache_read_price = 0.3
# cache_creation_price = 3.75
# currency = "usd"
# max_output_tokens = 8192
# supports_tools = true
# supports_thinking = true
# # 可选：Anthropic 自动缓存断点注入策略（T007，仅 anthropic 型 vendor
# # 转换出站生效；与 supports_* 能力位正交）。缺省 = 启用 / 上限 4 /
# # 锚序 tools→system→last_user（超限保留锚序尾部）。缓存写按 1.25×
# # 计费、命中读按 0.1×——成本/性能取舍可按条目关闭。
# [model_catalog.cache_breakpoints]
# enabled = true
# max_breakpoints = 4
# anchors = ["tools", "system", "last_user"]

[[vendors]]
id = "openai"
name = "OpenAI"
type_ = "openai"
api_key_env = "OPENAI_API_KEY"
# 可选：多 key 池（T005）——显式 env 名列表，与 api_key_env 合并去重
# （本列表在前），按序轮换出站 key；401/403 认证失败自动切换下一把
# （生效于下次请求）。缺 env 的名跳过并告警；池空回退 api_key_env 单 key。
# api_key_envs = ["OPENAI_API_KEY_2", "OPENAI_API_KEY_3"]
api_base = "https://api.openai.com/v1"
enabled = true
concurrency = { requests_per_second = 100 }
rate_limit = { type = "token", max_tokens = 10000000 }

[[vendors.models]]
model_id = "gpt-3.5-turbo"
enabled = true
weight = 1.0

[[vendors.models]]
model_id = "gpt-4"
enabled = true
weight = 1.0

[[vendors]]
id = "anthropic"
name = "Anthropic"
type_ = "anthropic"
api_key_env = "ANTHROPIC_API_KEY"
api_base = "https://api.anthropic.com/v1"
enabled = true
concurrency = { requests_per_second = 100 }
rate_limit = { type = "token", max_tokens = 10000000 }

[[vendors.models]]
model_id = "claude-3-opus-20240229"
enabled = true
weight = 1.0

# gRPC Server（feature = "grpc"）— sdforge grpc 门面。缺席或 enabled = false
# 时 gRPC 服务器禁用。认证复用 [auth] 段摘要校验；TLS 由外部反代承担。
[grpc]
enabled = false
host = "0.0.0.0"
port = 50051

[global_model]
enabled = true
strategy = "weighted"

# Pricing — vendor + model 维度的输入/输出 token 单价（每 1k tokens，USD）
# 未配置 [[pricing]] 时 CostCalculator 全部返回 0.0
[[pricing]]
vendor_id = "mock-openai"
model_id = "gpt-4"
input_per_1k_tokens = 0.03
output_per_1k_tokens = 0.06

[[pricing]]
vendor_id = "mock-anthropic"
model_id = "claude-3-opus-20240229"
input_per_1k_tokens = 0.015
output_per_1k_tokens = 0.075

# ---- 价格因子路由（T007）：[routing] 段可选开关 ----
# model_catalog 单价参与加权路由（默认开启；目录为空或候选未登记时中性，
# 等价条件下低价候选胜出）。关闭后路由行为与历史逐位一致。
# [routing]
# price_factor_enabled = true
