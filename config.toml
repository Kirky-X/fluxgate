[server]
host = "0.0.0.0"
port = 8080

[database]
path = "./data/llm_proxy.db"
pool_size = 5

# API Key Authentication
# 热生效：本段（key 吊销/轮换、enabled 开关）经 POST /admin/config 更新后
# 立即生效——认证中间件每请求从热配置现读，无需重启。
# 注意 [server] 与 [cors] 为建站期消费（sdforge 中间件固化于 Router 构造），
# 更新后接口会返回 restart_required 提示，需重启进程生效。
[auth]
enabled = true
# API keys are hashed SHA256, add your keys here
# Use command: echo -n "your-api-key" | sha256sum
api_keys = [
    # "example-key-hash-1234567890abcdef..."
]

[auth.header]
name = "Authorization"
prefix = "Bearer"

# API key 档位表（recId=16，可选）：拥塞准入的优先级基准。hash 与
# api_keys 同形态（SHA256 hex，echo -n "key" | sha256sum）；tier ∈
# dedicated/guaranteed/elastic/spot（基准权重 1000/100/1/0.1）。未在
# 此声明的 key（含 api_keys 列表全部）缺省 elastic——不配置本子表时
# 行为与现状逐位一致。热生效：认证与准入每请求从热配置现读。
# 示例（按需取消注释）：
# [[auth.keys]]
# hash = "example-key-hash-1234567890abcdef..."
# tier = "dedicated"

# CORS Configuration
# 注：sdforge 0.5 rc.5 校验要求 origin 携带 http(s):// 前缀，通配 "*" 不被
# 接受——所有条目均为 "*"（如下默认值）时网关不挂 CORS 层；需要跨域时
# 请写具体 origin，如 allowed_origins = ["https://console.example.com"]
[cors]
enabled = true
allowed_origins = ["*"]
allowed_methods = ["GET", "POST", "OPTIONS", "PUT", "DELETE"]
allowed_headers = ["*"]
allow_credentials = false
max_age = 86400

# Inbound Rate Limiting (recId=3)
# 【restart-required】本段在 Router 构造期消费（与 [server]/[cors] 先例一致），
# POST /admin/config 更新本段不热生效；热下发列二期。
#
# 规则形态（[[rate_limit.rules]]，滑动窗口）：
# - id: 规则标识（观测/日志维度）
# - path: 端点路径前缀（如 "/v1/chat/completions"）；缺省 = 全局规则，
#   注入 limiteron Governor。注意 Governor 决策链为规则级单例桶，
#   per_tenant 在该层不生效（limiteron 能力边界）；需要按租户隔离的
#   配额请配置 path 前缀
# - per_tenant: 按调用方 API key（SHA256 摘要）分桶，默认 true。认证关闭
#   或请求未携带 key 时统一归入单一 anonymous 桶（此时退化为全局桶）；
#   配置为 false 时为规则级单桶
# - window_secs / max_requests: 窗口时长（秒）与窗口内最大请求数；
#   超限返回 429 + Retry-After
#
# rules 为空（默认）= limiteron Governor 内置兜底规则（容量 100、补速
# 10/s 的令牌桶），与历史版本行为逐位一致。旧形态的扁平字段
#（enabled/requests_per_second/burst_size/... 与 [[rate_limit.endpoints]]）
# 此前从未被消费，已废弃。
[rate_limit]

# 示例（按需取消注释）：
# [[rate_limit.rules]]
# id = "chat-tenant"
# path = "/v1/chat/completions"
# per_tenant = true
# window_secs = 60
# max_requests = 100

# Outbound Retry Policy (recId=7)
# 热生效：本段经 POST /admin/config 全量更新后，下一次重试循环即用新参数
# （worker 每请求从热配置现读）。
# - max_retries: 单 vendor 内最大重试次数（不含首次调用）
# - retryable_status_codes: 触发重试的状态码集合（429 走指数退避，5xx 走固定 1s；
#   集合外状态码一律不重试）
# - 429 优先采用上游 Retry-After 头；指数退避叠加 ±20% jitter（jitter=0.2）
# - spread_jitter: Retry-After 与 5xx 固定间隔分支的同步惊群展宽比例
#   （recId=5）：延迟 = base + U(0, spread_jitter)×base（base 为
#   Retry-After 值或 1s），1.0 = 全范围展宽 [base, 2×base)，多实例/多并发
#   在同一 Retry-After 下不再同刻唤醒重试。
#   回滚路径：spread_jitter = 0 可完全恢复旧行为（Retry-After 原样返回、
#   5xx 固定 1s）。
# - max_total_attempts: 换路 fallback 的总尝试预算（主 vendor 重试耗尽或
#   429/5xx 时排除该 vendor 重路由，防止 vendor 数 × 重试数爆炸）
# - retry_budget_secs: 单请求重试总时间预算（recId=9）。**默认 0 = 不限时
#   （现状）**。>0 时单 vendor 重试循环与跨 vendor fallback 循环在每次
#   等待/重派前检查「锚点耗时 + 下次延迟」是否超预算，超限返回最后错误
#   （Portkey 递减式预算对照——防重试等待把单请求拖到分钟级）。
# - amplification_gate: 重试放大守门器（recId=9，λ_eff/f_c 亚稳态防护）。
#   **默认 false = 只记 metrics 计数，行为与现状逐位一致**。开启时在换路
#   fallback 入口评估：失败率 f > 0.8·f_c（临界失败率）→ 本请求
#   max_total_attempts 临时收紧到 1 + tracing::warn（误触发退化为单尝试，
#   fail-safe 方向正确）；r·f > 0.95 → 发散告警（只 warn）。输入：
#   r=重试请求数/失败请求数（metrics 重试维度计数）、f=全生命期失败率、
#   λ=60s 流量窗总量/60、C=Σ enabled vendor 并发上限（全部不限时则
#   C=0，不收紧只告警）。
[retry]
max_retries = 3
retryable_status_codes = [429, 500, 502, 503]
initial_delay_ms = 1000
factor = 2.0
max_delay_ms = 16000
jitter = 0.2
spread_jitter = 1.0
max_total_attempts = 8
retry_budget_secs = 0
amplification_gate = false

# Routing Weights (recId=10)
# 热生效：本段经 POST /admin/config 全量更新后立即生效（Router 每次路由
# 从热配置现读，无需重启）。
#
# 权重公式：
#   weight = w_model×model.weight + w_queue×queue_factor + w_window×window_factor
#          + w_latency×latency_factor + w_error×error_factor
# 最终权重经温度平滑 w^(1/temperature)。
#
# 默认值保持历史 3D 权重（0.4/0.3/0.3），新维度 w_latency/w_error 默认 0
# （关闭）——线上路由行为不变，显式开启才生效。
#
# 命名预设（等价系数组合，手填即可）：
#   quality = { w_model = 0.7, w_queue = 0.2, w_window = 0.1 }
#   latency = { w_model = 0.2, w_queue = 0.2, w_window = 0.2, w_latency = 0.4, latency_ref_ms = 500.0 }
#   cost    = { w_model = 0.2, w_queue = 0.2, w_window = 0.6 }
[routing]
w_model = 0.4
w_queue = 0.3
w_window = 0.3
# EWMA 第 4 维（默认关闭）：延迟因子 = latency_ref_ms/(latency_ref_ms+ewma_ms)，
# 错误因子 = 1 - ewma_error_rate；错误率 EWMA α=0.2 固定，延迟 EWMA 已改
# Peak-EWMA（recId=8，见下方 ewma_tau_ms；且 ewma_latency_ms 口径已收窄为
# 非流式端到端 e2e——流式为 TTFT 道，见下【顺序依赖】注释）
w_latency = 0.0
w_error = 0.0
latency_ref_ms = 1000.0
# 温度平滑（herding 缓解）：1 = 不平滑；>1 压平差距；<1 放大差距
temperature = 1.0
# 选择算法："weighted"（轮盘赌）| "power_of_two"（Po2C 实验：均匀采样
# 2 候选、按 EWMA 延迟择优；等熵监控有数据后再评估切默认）| "linucb"
#（recId=15：LinUCB bandit 档——候选集内按 UCB = ⟨x,θ̂⟩ + α√(xᵀA⁻¹x)
# argmax，per (abstract_model, vendor_id) 臂、成败 0/1 代理奖励，特征 =
# [截距, ln(1+消息数), ln(1+body 字符数), 含 tools, 流式]；需网关进程
# 接线 BanditState 且请求特征可得，未接线/特征缺失时回退 weighted；
# 亲和 hard 命中仍优先、fail-open 安全网路径不受影响）。未知值一律按
# "weighted"（默认与回滚同路径）。热生效同上。
selection = "weighted"
# LinUCB 探索参数 α（recId=15）：ucb(x,α) 的探索半径。**仅 selection=
# "linucb" 时被咨询**（默认 selection="weighted"，本参数不参与任何路径
# ——关闭由 selection 档位承担）。0/负值 = 关闭探索（纯贪心 θ̂ argmax），
# 非有限按 0。臂矩阵正则初值 = max(α²,1)·I（进程启动定死；α 热更只影响
# 探索半径，已有臂的 A/b 不重建；状态重启归零、特征集变更不可迁移）。
# 热生效同上。
ucb_alpha = 1.0
# 负载维（queue_factor）输入档位（recId=6，单选）：
# - "queue"（默认）：worker 队列深度——历史行为，线上路径不变
# - "in_flight"：在途请求数（并发 permit 占用，流式 permit 随流存活，
#   对长流真实生效——LiteLLM least_busy / Kong least_connections 同信号）
# - "in_flight_relative"：在途相对化 (x−fleet_mean)/max(1,fleet_mean)
#   （vLLM production-stack 公式，分母钳 1 防近空闲舰队放大噪声）
# 注意：负载维输入是单选开关，切到 in-flight 档时队列深度退出该维
#（不叠加为次级加权项）；未知值按 "queue" 处理（回滚阀）。
load_signal = "queue"
# Peak-EWMA 时间常数 τ（recId=8，毫秒）：延迟 EWMA 的动态平滑系数
# α = 1−exp(−Δt/τ)（Kong DECAY_TIME=10s 同值）。久未采样 α→1 快速反映
# 恢复；高频采样平滑抗噪。落账前热同步（POST /admin/config 立即生效）。
# 0 = 极限「完全采新样本」（无平滑），慎用。
ewma_tau_ms = 10000
# min+buffer 候选集缓冲（recId=8，LiteLLM lowest_latency_buffer 语义）：
# > 0 时选择先取「ewma_e2e ≤ 最低×(1+buffer)」的候选集、集合内均匀随机
#（延迟相近的候选共享流量，防打爆最快者）。**默认 0.0 = 关闭**（轮盘赌
# 与历史逐位一致）。
# 【顺序依赖】延迟信号已按口径分道（TTFT/端到端/排队；流式 TTFT 以
# 「send→上游响应头」近似——严格首 token 口径网关侧拿不到）。先观察
# /admin/metrics 的 ewma_e2e_ms / ewma_ttft_ms 分道数据，再把 w_latency
# 调非零 / latency_buffer 调非零。
latency_buffer = 0.0
# 请求级权重开关（recId=19(a)，X-Weight 头，LiteLLM simple_shuffle
# _router_weights 对照）：**默认 false = 头被忽略**（路由行为与现状逐位
# 一致）。开启且请求携带合法 X-Weight（有限正数，非法值忽略）时覆盖
# model.weight 参与权重计算。热生效：POST /admin/config 更新后下一请求
# 即用新值（Router 每次路由现读）。
allow_request_weight = false
# 全冷却 fail-open 安全网（recId=19(b)）：**默认 false = 全候选被剔除时
# 保持 Validation 错误（现状）**。开启时全部候选因 CB Open / Throttled
# 被路由层剔除的情况下，回落「忽略状态但 enabled」的候选集加权选择。
# 现实约束：NexusFlow 无主动健康检查驱动的冷却，全部为真实失败冷却——
# 本开关覆盖的是 CB Open 超时未过窗口 / 限流窗口未重置，语义弱于
# LiteLLM 的 health-check 限定；把已冷却 vendor 重新纳入流量是有意冒险，
# 仅建议有兜底容量的部署开启。热生效同上。
fail_open_when_all_cooling = false
# Retry-After 提示（recId=19(c)）：**默认 false = 换路耗尽时原错误冒泡
# （503 语义不变）**。开启且耗尽时全部排除原因为 Throttled → 返回
# AllVendorsThrottled（429 + Retry-After 头，秒数 = 各 vendor 限流窗口
# 重置剩余的 min）。已知边界：handler 首路由即全 Throttled 的入口场景
#（? 早退、Validation 错误丢失原因）不覆盖。热生效同上。
retry_after_hint = false
# 会话亲和模式（recId=10(1)）：**默认 "hard"（现状：命中即返回，绑定
# vendor 在合格集合内时必选）**；"soft"：命中软化为评分项——命中 vendor
# 权重 ×(1 + affinity_boost_factor) 后与其余候选照常竞争（弱粘性，提升
# 负载均衡响应度；注意可能降低缓存/前缀复用命中率，affinity_hit_rate
# 指标已有，切换前先定观察窗口）。未知值一律按 "hard"。热生效同上。
affinity_mode = "hard"
# soft 模式命中 vendor 的权重乘子基准（recId=10(1)）：权重乘
# (1 + affinity_boost_factor)。默认 1.0（×2 boost）；仅在 soft 模式生效，
# 负值按 0 处理。热生效同上。
affinity_boost_factor = 1.0
# 亲和键租户隔离（recId=10(2)）：**默认 false = legacy 键
# affinity:{session_key}（现状逐位一致）**。开启时键改为
# affinity:{api_key_hash}:{session_key}（hash 与响应缓存同源）——实为
# 租户劫持修复（两租户同 session id 不再互相劫持），建议上线开启；
# 键格式变更换代使存量绑定一次性失效（TTL 1h 内自然过渡）。热生效同上。
affinity_tenant_scoped = false
# SLA/满意度虚拟队列打分项强度 V（recId=14，SLARouter 零模型版）：
# **默认 0.0 = 关闭**（惩罚项不参与权重、虚拟队列 Q 不更新，路由行为
# 与现状逐位一致）。>0 时每候选权重末尾乘惩罚因子
#   1 / (1 + V·Ĉ_m + max(0, Q·(α − ŝ_m)))
# 其中 ŝ_m = 1 − EWMA 错误率（无观测数据 = 1.0 冷启动乐观）；
# Ĉ_m = [[pricing]] 的 (input+output)/2 每 1k 单价；缺价候选记「候选集内
# 已知单价的中位数」（保守不奖励——记 0 会让无定价 vendor 获得最小惩罚、
# 乘法式下权重最高，与成本感知目的相反）；候选集全无定价时成本项整体
# 置 0（退化为纯 Q 项，进程内 warn 一次）。虚拟队列 Q 按租户（调用方
# API key 哈希）分桶、无租户上下文时用 "global"（分桶不受
# affinity_tenant_scoped 影响——那只是亲和键格式开关）；每轮选择完成后
# 对偶更新 Q ← max(0, Q + α − ŝ_selected)（决策时更新、无需执行结果
# 回传；重启归零，Lyapunov 收敛自动重建）。与失败率软降权、亲和 boost
# 独立乘法叠加。负值/非有限值同样视为关闭。热生效同上。
sla_v = 0.0
# 目标服务水平 α（recId=14，[0,1]）：α < ŝ（满意度达标）→ Q 衰减归 0；
# α > ŝ（服务欠账）→ Q 累积、欠账 vendor 权重被压。默认 0.95；非有限/
# 越界值钳回 [0,1]（NaN 按 0 处理 = Q 恒 0，退化为纯成本项）。热生效同上。
sla_alpha = 0.95
# LPS 排队论延迟前瞻软约束强度 δ（recId=17，论文式 10：
# Ŵ=(α/μ)^k/(μ−α)，ρ→1 发散；α=60s 流量窗到达率，μ=1/ewma_e2e_ms，
# k=vendor 并发上限缺省 100）。**默认 0.0 = 关闭**（Ŵ 不参与权重，
# 行为与现状逐位一致）。>0 时权重末尾乘 1/(1 + δ·Ŵ/Ŵ_ref)——乘法软
# 约束为对报告线性 −δ·Ŵ 的有意偏差（线性负项会触发 compute_weight
# 非正归零保护造成权重归零剔除）；Ŵ_ref = 当次候选集内 Ŵ 中位数
#（相对归一，零新增配置；全候选发散时中位数=CAP → 因子均匀不扭曲
# 选择）。无 e2e 观测的 vendor Ŵ=0 中性（冷启动不惩罚）。注意 ewma_e2e
# 口径含排队，作为服务时长近似会高估 Ŵ（粗分类定位）。负值/非有限
# 视为关闭。热生效同上。
lps_delta = 0.0
# LPS 硬约束门控（recId=17）：**默认 false = 不消费 deadline、不做可行
# 集筛选**（行为与现状逐位一致）。开启后按 Ŵ≤deadline 筛可行集（deadline
# 取 x-deadline-ms 头，缺省用 default_deadline_ms），可行集为空时改选
# Ŵ 最小者（JITServe 软信号语义，不拒绝服务）；亲和 hard 命中优先于本
# 筛选。热生效同上。
lps_deadline_gate = false
# 默认截止（毫秒，recId=17）：lps_deadline_gate 开启且请求未携带
# x-deadline-ms 头时使用。默认 10000 为示例值，按业务 P99 与
# /admin/metrics 的 ewma_e2e_ms 观察调整。热生效同上。
default_deadline_ms = 10000

# Resilience Coverage (recId=2)
# 热生效：本段经 POST /admin/config 全量更新后，下一次请求即生效
#（执行路径每请求从热配置现读，无需重启）。
#
# - cover_all_paths: 熔断/重试/换路覆盖到透传与流式路径。**默认 false**：
#   关闭时透传非流式（无熔断）、透传流式、转换流式三条裸路径与历史行为
#   逐位一致（仅转换非流式有换路 fallback）。
#   开启后（建议先在灰度环境评估）：
#   1) 透传非流式由 per-vendor 熔断器包裹，失败进入换 vendor 换路循环；
#   2) 两条流式路径的 send+响应头校验段由熔断器包裹——首字节（响应头）
#      前失败自动换 vendor 重派（OpenRouter 语义），流中错误仍以 SSE
#      error 事件终止、不再换路；
#   3) 【运维影响面】熔断 Open 状态会直接拒绝透传/流式请求（该请求转而
#      换路；无候选时返回 503 "circuit open"）。历史版本熔断只作用于
#      转换非流式路径，开启本开关后透传与流式流量同样受熔断治理。
#   换路预算与触发条件复用 [retry] 段（max_total_attempts / 触发=全部）。
#
# - failure_rate_gate: 失败率软降权（recId=7）。**默认 false**——关闭时
#   路由权重与历史逐位一致（窗口计数在 /admin/metrics 常开，纯观测）。
#   开启时每 vendor 的 60s 滑窗失败率超阈即权重打折（软降权只打折不剔除，
#   路由层 ==Available 过滤不动——劣化 vendor 仍参与路由，只是份额收缩）：
#   窗内总样本 ≥ failure_rate_min_samples 且 失败率 > failure_rate_threshold
#   → 该 vendor 权重 × failure_rate_penalty（LiteLLM 数值对照 0.1）。
#   429 感知：失败率窗口把 RateLimited（上游限流/本地 token 窗耗尽）也计
#   入失败——独立于熔断器计数（CB 对 429 无感），上游正常限流也可能触发
#   降权，penalty=0.1 而非剔除、风险有界。
#
# - circuit_open_timeout_ms: 熔断 Open→HalfOpen 的超时窗口（毫秒），
#   **默认 30000**。调小加速故障恢复探测（对抖动上游恢复更灵敏）、调大
#   避免对持续故障上游的探针风暴；热生效：经 POST /admin/config 全量
#   更新后，新建 vendor 实例即采用新值（已热建的实例沿用创建时窗口）。
[resilience]
cover_all_paths = false
failure_rate_gate = false
failure_rate_min_samples = 5
failure_rate_threshold = 0.5
failure_rate_penalty = 0.1
circuit_open_timeout_ms = 30000

# Congestion-Aware Priority Admission (recId=16)
# 热生效：本段经 POST /admin/config 全量更新后立即生效（准入每请求从
# 热配置现读，无需重启）。
#
# 网关侧并发占用率（Σ in_flight / Σ vendor 并发上限）达到
# congestion_threshold 时，新请求的档位优先级与「当前在途最小档」比较：
#   priority = w_tier / (1+α_slo·ℓ*) / (1+α_burst·b) / (1+α_debt·d)
# 低于在途最小档者直接 429 + Retry-After（不排队）；同档/高档照常放行
#（同档内保持先到先得）。w_tier 见 [[auth.keys]]（缺省 elastic=1.0）；
# ℓ*（SLO 缺口）维度本版无数据源恒 0（该项恒 1，α_slo 预留）；b/d 为
# per-key 的到达速率/被拒频度 EWMA（网关侧近似，粗分类 shed 定位）。
# 健康检查路径永不卸载。
[admission]
# **默认 false = 完全关闭**：准入判定旁路、EWMA 不记账、per-tier 在途
# 计数不参与（行为与现状逐位一致）。
enabled = false
congestion_threshold = 0.9
alpha_slo = 2.0
alpha_burst = 1.0
alpha_debt = 4.0

# Exact Response Cache (recId=12)
# 热生效：本段经 POST /admin/config 全量更新后，下一次请求即用新参数
#（ResponseCache 每次操作从热配置现读，无需重启）。
# - enabled: 精确响应缓存开关。**默认 false**——TTL 内响应陈旧是产品
#   语义，上线由运维显式打开。
# - ttl_secs: 缓存 TTL（秒），默认 300。
# 仅确定性请求参与：stream==false && tools 为空 && temperature==0 或缺省；
# 请求头 X-No-Cache: 1 强制回源；命中响应带 X-Cache: HIT，未命中 MISS。
# 键 = resp:{api_key_sha256}:{vendor}:{model}:{sha256(canonical_body)}，
# 调用方 API key 哈希入键做租户隔离；存储落地 oxcache 内存后端。
# gRPC Server（feature = "grpc"）— sdforge grpc 门面（sdforge.v1.SdForgeService）
# 建站期消费：GrpcServerConfig 固化于服务器构造，更新后需重启进程生效。
# 本段缺席或 enabled = false 时 gRPC 服务器完全禁用（不监听 50051，
# 行为与历史逐位一致）。feature 开启方式：cargo build --features grpc。
# - port: gRPC 监听端口（50051 为 gRPC 惯例端口）。
# - timeout_seconds: per-call 超时（秒），0 = 不限；默认 30。
# - max_connections: 每连接并发上限；0 = tonic 默认；默认 1000。
# - http2_keepalive_interval_secs / http2_keepalive_timeout_secs: HTTP/2
#   keepalive 探测间隔/超时（秒），缺席 = tonic 默认。
# 认证：门面调用（Call/CallStream/GetInfo）经 auth_verifier 校验，
# 复用 [auth] 段 SHA256 摘要 + 常量时间比较（语义对齐 HTTP 中间件；
# 与 HTTP /health 白名单的差异：gRPC 侧无 method 白名单，一律要求 key）。
# TLS 不经 sdforge 终结（明文监听，由外部反代承担），与 [server] 同策略。
[grpc]
enabled = false
host = "0.0.0.0"
port = 50051
timeout_seconds = 30
max_connections = 1000
http2_keepalive_interval_secs = 30
http2_keepalive_timeout_secs = 10

[cache]
enabled = false
ttl_secs = 300
# TTL 负载联动（recId=12）：**默认 false = 纯静态 TTL**（与现状逐位一致）。
# 开启时实际 TTL = ttl_secs × 类别乘数 × (1 + λ·(β_max−1))，其中
# λ = min(1, (L_p/L_target)·w_L + (Q/Q_target)·w_Q)——L_p 取该 vendor 的
# ewma_e2e_ms（口径降级：论文为 P95 分位，本实现用 EWMA 均值替代，高估
# 方向安全）；Q 取该 vendor 的 60s 流量份额。冷 vendor（无观测）λ=0 不
# 惩罚冷启动。热生效同上。
ttl_load_linked = false
w_l = 0.0
w_q = 0.0
beta_max = 1.5
l_target = 1000.0
q_target = 0.5
# 类别乘数表（recId=12，可选）：按 model_id 前缀匹配首条命中，无命中
# 乘数 1.0；与负载联动开关独立生效。示例（按需取消注释）：
# [[cache.categories]]
# model_id_prefix = "gpt-4"
# multiplier = 2.0

[[vendors]]
id = "mock-openai"
name = "Mock OpenAI"
type_ = "openai"
api_key_env = "MOCK_OPENAI_KEY"
api_base = "http://127.0.0.1:8001/v1"
enabled = true
# fallback 优先级：数值越小越优先（1 = primary；recId=7 换路 fallback）
priority = 1
# concurrency 可选 token 加权票据（recId=18，默认 false = 单票据现状）：
# token_weighted = true 时并发票据按预估 token 量计费（cost = clamp(
# messages 序列化字节/4 + max_tokens, token_ticket_min, token_ticket_max)，
# max_tokens 缺省按 token_ticket_default=4096 兜底）——agentic 长会话不再
# 与短请求等价占票；in_flight 信号同步变 token 加权口径。restart-required
#（vendor 实例构造期消费）。票据饥饿为机制内生风险，token_ticket_max
# 为逃逸阀。示例：concurrency = { requests_per_second = 100,
# token_weighted = true, token_ticket_max = 16384 }
concurrency = { requests_per_second = 100 }
# Outbound HTTP timeouts (recId=4) — 三层模型，**0 = 对应层不限时（逃生阀）**：
# - timeout_ms: 非流式请求 per-attempt 总超时（从 send 发起起算至响应体读完，
#   不含本地排队；每次重试独立计时）。默认 60000
# - stream_ttft_ms: 流式首包（TTFT）超时——send 发起至上游响应头返回；首包
#   返回后愿意继续等（Cloudflare 口径）。默认 60000
# - stream_idle_ms: 流式 chunk 间 idle 超时（相邻上游字节块最大间隔，超时以
#   Timeout 终止流）。默认 30000；慢生成流（分块间隔可能超 30s 的长思考型
#   模型）请调大或以 0 关闭
# 长思考型模型同样建议调大 timeout_ms/stream_ttft_ms 或以 0 关闭
timeout_ms = 60000
stream_ttft_ms = 60000
stream_idle_ms = 30000
# window_hours：Token 配额窗口时长（缺省 24h）；窗口由 limiteron
# FixedWindowLimiter 惰性重置（recId=5）。可选 sliding = true 换滑动窗口
#（recId=11：消除固定窗口翻越点的瞬时 2× 配额双花，ShardedSlidingWindow
# 实现；缺省 false = 固定窗口现状，reset_secs 以窗口全长为近似上界）。
rate_limit = { type = "token", max_tokens = 10000000, window_hours = 24 }

[[vendors.models]]
model_id = "gpt-3.5-turbo"
enabled = true
weight = 1.0

[[vendors.models]]
model_id = "gpt-4"
enabled = true
weight = 1.0

[[vendors]]
id = "mock-anthropic"
name = "Mock Anthropic"
type_ = "anthropic"
api_key_env = "MOCK_ANTHROPIC_KEY"
api_base = "http://127.0.0.1:8001/v1"
enabled = true
priority = 1
# concurrency 可选 token 加权票据（recId=18，默认 false = 单票据现状）：
# token_weighted = true 时并发票据按预估 token 量计费（cost = clamp(
# messages 序列化字节/4 + max_tokens, token_ticket_min, token_ticket_max)，
# max_tokens 缺省按 token_ticket_default=4096 兜底）——agentic 长会话不再
# 与短请求等价占票；in_flight 信号同步变 token 加权口径。restart-required
#（vendor 实例构造期消费）。票据饥饿为机制内生风险，token_ticket_max
# 为逃逸阀。示例：concurrency = { requests_per_second = 100,
# token_weighted = true, token_ticket_max = 16384 }
concurrency = { requests_per_second = 100 }
# 出站三层超时（recId=4），语义与 0=禁用约定同上
timeout_ms = 60000
stream_ttft_ms = 60000
stream_idle_ms = 30000
# window_hours：Token 配额窗口时长（缺省 24h）；窗口由 limiteron
# FixedWindowLimiter 惰性重置（recId=5）。可选 sliding = true 换滑动窗口
#（recId=11：消除固定窗口翻越点的瞬时 2× 配额双花，ShardedSlidingWindow
# 实现；缺省 false = 固定窗口现状，reset_secs 以窗口全长为近似上界）。
rate_limit = { type = "token", max_tokens = 10000000, window_hours = 24 }

[[vendors.models]]
model_id = "claude-2"
enabled = true
weight = 1.0

[[vendors.models]]
model_id = "claude-3-opus"
enabled = true
weight = 1.0

[global_model]
enabled = true
strategy = "weighted"

# Pricing — vendor + model 维度的输入/输出 token 单价（每 1k tokens，USD）
# 未配置 [[pricing]] 时 CostCalculator 全部返回 0.0
[[pricing]]
vendor_id = "mock-openai"
