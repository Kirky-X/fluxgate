[package]
name = "nexusflow"
version = "0.1.0"
edition = "2021"
# MSRV 单一事实来源：与 7 个兄弟库的 rust-version 声明对齐（dbnexus/limiteron/
# sdforge 均为 1.97.1）。原先只写在 docker/Dockerfile 与 workflows 的注释里，
# 导致 release.yml 漂到 1.92 仍无门禁拦截。声明后 cargo 在依赖解析期硬拒低于
# 1.97.1 的工具链：ci.yml 按此下限跑 build/clippy，Dockerfile/release 用当前
# stable（高于下限即可）
rust-version = "1.97.1"
# `examples/` 现为独立 workspace 成员 crate（nexusflow-examples），不再充当
# 本包的示例约定目录。关闭本包对 examples/ 的示例自动发现，否则 examples/build.rs
# 等顶层 .rs 会被误认作 nexusflow 的 example target（在 `--all-targets` 下编译，
# 且找不到 build.rs 引用的 tonic_prost_build 而失败）。
autoexamples = false
description = "智能 LLM 路由代理系统 - 多厂商统一管理、格式转换、智能调度 | Intelligent multi-provider LLM routing gateway"
authors = ["Kirky-X <Kirky-X@outlook.com>"]
repository = "https://github.com/Kirky-X/NexusFlow"
keywords = ["llm", "gateway", "proxy", "openai", "anthropic", "routing"]
categories = ["network-programming", "web-programming::http-server", "api-bindings"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "nexusflow"
path = "src/main.rs"
required-features = ["full"]

[features]
# default 携带 db-sqlite：独立运行（cargo run）默认仍为 sqlite 文件库，与
# 历史行为逐位一致；库嵌入方用 default-features = false 自选后端。
# 注意：`--features full` 单独使用不再含任何数据库后端——dbnexus 的
# 「无数据库 feature」守卫会报编译错，full 必须搭配一个 db-* 组。
default = ["full", "db-sqlite"]
full = ["web-server", "database", "vendor-management", "router", "protocol", "infrastructure", "sdforge-integration", "logging", "resilience", "cost-tracking", "sdk"]
# 数据库后端三组（互斥由 dbnexus 编译期守卫强制：embedded 与 server-side
# 不可混，见 ../dbnexus/src/lib.rs 规则 2）。驱动选择交给使用方/部署方，
# 不在依赖声明里写死——对齐 crawlrs db-* 透传模式（crawlrs/Cargo.toml
# db-postgres/db-sqlite/db-mysql 组）。replica-routing 必须随任一后端透传：
# inklog 的 dbnexus 集成无条件引用 DbConfig.replica_config。`?` 语法：仅当
# dep:dbnexus/dep:inklog 已被 database/logging 激活时生效，不反向引入。
db-sqlite = ["dbnexus?/sqlite", "dbnexus?/runtime-tokio-rustls", "dbnexus?/replica-routing", "inklog?/sqlite"]
db-postgres = ["dbnexus?/postgres", "dbnexus?/runtime-tokio-rustls", "dbnexus?/replica-routing", "inklog?/postgres"]
db-mysql = ["dbnexus?/mysql", "dbnexus?/runtime-tokio-rustls", "dbnexus?/replica-routing", "inklog?/mysql"]
# database 显式入链：原 web-server→router→vendor-management→database 的
# 传递依赖在解除 vendor-management→database 后改为显式声明（服务器装配
# bootstrap 需要 Database，行为面与历史组合逐位一致）；dep:limiteron 供
# api/router_builder 的入站限流直用；infrastructure 供 server/shutdown 的
# trait-kit 协调器；dep:hex/sha2/subtle/once_cell 为 api/middleware 面直用
#（web-server 关闭时不激活本 crate 的这些直接依赖；兄弟库的传递依赖不受影响）
web-server = ["dep:axum", "dep:tower", "dep:tower-http", "dep:async-stream", "router", "sdforge-integration", "http", "database", "infrastructure", "dep:limiteron", "dep:hex", "dep:sha2", "dep:subtle", "dep:once_cell"]
# sdforge `#[forge]` 宏按**目标 crate** 的 feature 求值 `cfg(feature = "http")`
# （rustc check-cfg 文档明确此语义）：无同名 feature 时 RouteRegistration
# 整体被 cfg 掉，#[forge] 站点路由（/health）静默丢失。此 feature 无实现体，
# 仅作为宏门控开关随 web-server 启用。
http = []
# resilience：韧性模块门控（FallbackChain + 错误映射层 + metrics 韧性观测），
# 与 api 侧换路编排同名单开关联动。熔断器已迁移 limiteron::circuit、重试
# 延迟已迁移 limiteron::retry，无需独立第三方依赖
resilience = []
# cost-tracking：CostTracker 的分片锁并发 map
cost-tracking = ["dep:dashmap"]
# database 的 async_logger（DB sink）无条件消费 inklog 类型，logging 为
# 编译前提；替代方案（对 async_logger 做 cfg 门控）需同步 server/shutdown、
# api 测试与集成测试多处消费点，属独立重构，暂以显式联动收口
database = ["dep:dbnexus", "dep:sea-orm", "dep:async-channel", "dep:url", "protocol", "logging"]
# vendor 栈（vendor 模块：reqwest 出站 + limiteron 限流/熔断原语 + 队列通道，
# rand 供加权采样）；
# database 联动已解除（design.md D1 feature 图重切）——不携带存储
vendor-management = ["dep:reqwest", "dep:limiteron", "dep:rand", "dep:async-channel"]
# router（router 模块，含 vendor-management 联动）；dep:oxcache 供
# response_cache/bootstrap 直用 CacheBackend
router = ["vendor-management", "dep:oxcache"]
# marker feature（当前无 cfg 消费点；保留组合位与单开关语义）
protocol = []
infrastructure = ["dep:oxcache", "dep:trait-kit"]
sdforge-integration = ["dep:sdforge"]
# gRPC 服务器（sdforge grpc 门面）：独立 feature 不进 full——sdforge 的
# grpc feature 编译期需要 protoc（编译 proto/sdforge.v1.proto），默认构建
# 不引入该工具链前置。feature 名兼作 `#[forge]` 宏在目标 crate 上的
# `cfg(feature = "grpc")` 门控（同 http = [] 的机制，见上注）。
# 服务器模块另受 web-server + logging 门控（与 HTTP 共用装配链）。
grpc = ["dep:sdforge", "sdforge/grpc", "sdforge/graceful"]
logging = ["dep:inklog"]
# sdk：HTTP 客户端 SDK（src/sdk，调用已部署网关的 Rust 客户端）。
# reqwest 复用 vendor-management 的 optional 依赖；eventsource-stream 仅做
# SSE 事件分帧（default=[std] 仅 futures-core/nom，无 reqwest 强制依赖）；
# url 供 base URL 拼接
sdk = ["dep:reqwest", "dep:eventsource-stream", "dep:url"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("openapi"))'] }

[dependencies]
# Web 框架
axum = { version = "0.8", features = ["macros"], optional = true }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.7", features = ["cors", "trace", "request-id"], optional = true }

# 数据库 — path dep 本地源码（kit feature 暴露 integrations::kit::DbNexusModule）。
# 后端（sqlite/postgres/mysql）与 runtime 不在此声明——由 db-* 三组透传 feature
# 按构建选择（Cargo feature 只加不减，写死会锁死单一后端）
dbnexus = { path = "../dbnexus", default-features = false, features = ["permission", "sql-parser", "macros", "config-env", "with-time", "kit", "migration", "auto-migrate"], optional = true }
sea-orm = { version = "2.0.4", default-features = false, optional = true }

# 日志 — path dep 确保 oxcache/dbnexus/trait-kit 全部本地对齐。
# 落库后端（sqlite/postgres）随 db-* 三组经 inklog?/<backend> 透传，不在此写死。
# fast-masking：掩码规则 literal 走 Aho-Corasick 单趟加速；secret-scan：出站
# 裸 secret 值形态+熵扫描门（SecretPatternRegistry/SecretScanGate 导出）。
# http/cli（axum-server/clap/schema 面）本仓零调用，不声明——无 sdforge 的
# 轻量组合省约 40 个包（full 下 clap/schemars 由 sdforge 保留，仅省
# axum-server/fs-err/glob）；使用方需要时自行开启
inklog = { path = "../inklog", default-features = false, features = ["kit", "fast-masking", "secret-scan"], optional = true }
# 配置热重载 — path dep 本地源码；config 模块的 dynamic/snapshot/loader
# 三面 + json 强类型投影 + security-rules 弱密钥校验 + hot-reload-kit
#（watch + progressive-reload），不启用 env（无 .env 自动加载）。
confers = { path = "../confers", default-features = false, features = ["toml", "json", "dynamic", "snapshot", "security-rules", "hot-reload-kit"] }
tracing = "0.1"
# log 门面 → tracing 事件桥：reqwest/sea-orm/tokio-tungstenite 等依赖经
# log crate 输出，inklog LogAdapter 结构上只投 console+主 async 通道，
# 自定义 sink 通道到不了——先装 LogTracer 让这些记录进统一 tracing 总线
# （经 gate console sink 输出），inklog 自身 LogLogger 随之良性让位
tracing-log = { version = "0.2", default-features = false, features = ["log-tracer", "std"] }
tracing-subscriber = { version = "0.3", optional = true }

# 流控 — path dep 本地源码；"retry" 提供重试原语（recId=7：
# delay_for_attempt / RetryPolicy），删除 backon 后唯一的重试延迟实现
limiteron = { path = "../limiteron", default-features = false, features = ["tower-middleware", "ban-manager", "circuit-breaker", "gcra", "quota-control", "retry", "kit"], optional = true }

# 缓存 — path dep 本地源码
oxcache = { path = "../oxcache", default-features = false, features = ["minimal", "macros", "kit", "memory"], optional = true }

# DI — path dep（本地源码 0.5.0-rc.7）
trait-kit = { path = "../trait-kit", default-features = false, features = ["async", "shutdown"], optional = true }

# SDK 框架 — path dep（本地 0.5.0-rc.6 已修复 limiteron::FlowGuardError 不兼容问题）
sdforge = { path = "../sdforge", default-features = false, features = ["http", "security", "streaming", "health", "metrics", "context", "graceful", "openapi", "docs", "schemars"], optional = true }

# 序列化与核心
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
rand = { version = "0.8", optional = true }
once_cell = { version = "1", optional = true }
uuid = { version = "1", features = ["v4", "serde"] }
url = { version = "2", optional = true }
bytes = "1"
reqwest = { version = "0.13", features = ["json", "stream", "socks"], optional = true }
# SSE 事件分帧（sdk feature 的流式响应解析），0.2 为 crates.io 最新稳定
eventsource-stream = { version = "0.2", default-features = false, optional = true }
async-channel = { version = "2", optional = true }
async-stream = { version = "0.3", optional = true }
# CostTracker 的分片锁并发 map（cost-tracking）
dashmap = { version = "6", optional = true }
# 配置全量写回（persist_and_swap 的 toml::to_string_pretty）
toml = "1"
# i18n — Fluent 双束（en/zh）+ 语言检测链基座（i18n 模块常开）
fluent-bundle = { version = "0.16", default-features = false }
unic-langid = { version = "0.9", default-features = false }
sys-locale = { version = "0.3", default-features = false }
# API Key SHA256 摘要存储与常量时间比较（api/middleware 面三处消费）；
# sha2 0.11 对齐兄弟库——sqlx 侧 0.10 有两条上游锚点：sqlx-core 的 migrate
# feature（当前编译面）与 sqlx-macros-core 的非 optional 依赖（在解析图/
# Cargo.lock 中，本仓当前组合未开启其 macros feature 故不编译），其升级后
# 双版本自然收敛；subtle 沿用 core 面 default-features = false
sha2 = { version = "0.11", optional = true }
hex = { version = "0.4", optional = true }
subtle = { version = "2.6", default-features = false, optional = true }


[dev-dependencies]
# retry 预算测试用 paused clock（start_paused）
tokio = { version = "1", features = ["test-util"] }
# i18n 键位守卫：严格解析 .ftl（零 Junk）与占位符抽取（与 fluent-bundle 同源语法树）
fluent-syntax = { version = "0.12", default-features = false }
# log 门面桥测试：LogTracer 转发断言需 log 宏与 tracing Layer 捕获面
# （tracing-subscriber 主依赖为 optional，测试单独声明 registry 面）
log = { version = "0.4", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
# admin CRUD 测试的 ConfigManager 写路径：RAII 唯一临时目录（D7.6 同款，
# 取代手写 temp_dir 固定路径）
tempfile = "3"
tokio-test = "0.4"
mockall = "0.15"
mockall_double = "0.3"
http-body = "1.0"
futures-util = "0.3"
mockito = "1"
# 测试需要注入 limiteron MockClock（假时钟驱动熔断超时 / 限流窗口重置）；
# MockClock 仅在 test-clock feature 下从 limiteron 公开（limiteron src/lib.rs:320）
limiteron = { path = "../limiteron", features = ["test-clock"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# 统一自研库身份：所有对 crates.io 上自研库的依赖都重定向到同级本地源码，
# 避免 path 版与 registry 版并存导致 trait 身份分裂
[patch.crates-io]
trait-kit = { path = "../trait-kit" }
confers = { path = "../confers" }
dbnexus = { path = "../dbnexus" }
inklog = { path = "../inklog" }
limiteron = { path = "../limiteron" }
sdforge = { path = "../sdforge" }
oxcache = { path = "../oxcache" }

[workspace]
# 示例集合并为单一 crate（examples/）：内部按 feature 划分模块与 bin，
# 取代原 rest-http / sdk-usage / embedded-server / grpc-client 四个成员 crate。
members = [
    "examples",
]
