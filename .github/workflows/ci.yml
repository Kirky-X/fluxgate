#===============================================================================
# NexusFlow CI 质量门禁（对齐 confers 7 仓库统一基线）
# fmt / clippy / check / test / build / doc / coverage / security
# （特性全量矩阵见 feature-matrix.yml，CodeQL 见 codeql.yml.disabled）
#
# 与 confers 基线的差异：
#   - 自研 7 库经 crates.io registry 集成（版本写在 Cargo.toml、校验和锁在
#     Cargo.lock），各 cargo 作业直接拉取，无兄弟库克隆步骤；
#   - 本仓库无 Criterion 基准、无 deny.toml，故无 benchmarks 作业，
#     security 作业仅跑 cargo audit（补 deny.toml 后再加 cargo deny check）；
#   - CodeQL 为停用态：私有仓未启用 GHAS，SARIF 上传必被 API 拒绝——workflow
#     保留为 .github/workflows/codeql.yml.disabled，转 public / 启用 GHAS 后
#     重命名启用；
#   - 特性组合：本作业只跑手写组合矩阵（default / 两后端 / 单特性三组合），
#     逐特性全量矩阵在 feature-matrix.yml（每周定时 + 手动触发）；
#   - build / doc 按本仓特性面适配：`--all-features` 因 db-* 互斥不可用，
#     build 改「默认 + 零特性」两口径，doc 只跑默认口径；
#   - 无 docker 作业：镜像可独立构建（纯 registry 依赖，不取兄弟库源码），
#     镜像构建与扫描仍未纳入 CI。
#===============================================================================
name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  # 每日安全扫描：仅 security 作业响应 schedule，其余作业跳过
  schedule:
    - cron: '37 5 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_VERSION: '1.97'
  # ↑ MSRV 下限工具链：与 Cargo.toml 的 rust-version = "1.97.1" 对齐（'1.97'
  #   解析到当前最新 patch 1.97.1）。按 MSRV 跑 build/clippy 同时两个目的：
  #   守住兄弟库下限、让 clippy  lint 集合可复现（clippy 随工具链版本变化）。
  #   docker/Dockerfile 与 release.yml 用当前 stable（1.99），高于下限即可

jobs:
  #-----------------------------------------------------------------------------
  # 格式检查
  #-----------------------------------------------------------------------------
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 只读 token 不落盘（.git/config）
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  #-----------------------------------------------------------------------------
  # Clippy 零告警
  #-----------------------------------------------------------------------------
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 只读 token 不落盘（.git/config）
          persist-credentials: false
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # db-* 三组互斥由 dbnexus 编译期守卫强制（db-backend-selection），
      # --all-features 同时打开三个后端必然编译失败——clippy 跑 default 口径
      # （full + db-sqlite），非 default 后端组合由 check/test 的特性矩阵覆盖
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # 示例集单 crate 的 grpc 模块不在 default（保留「普通构建不需 protoc」的
      # 隔离），--all-targets 的 default 口径会跳过 grpc bin——显式补一条 grpc
      # feature 的 clippy，覆盖代码生成与 grpc_client 模块 lint（此作业已装 protoc）
      - name: Run clippy (examples grpc feature)
        run: cargo clippy -p nexusflow-examples --no-default-features --features grpc --all-targets -- -D warnings

  #-----------------------------------------------------------------------------
  # 编译检查（默认特性 / 三后端特性矩阵）
  #-----------------------------------------------------------------------------
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 只读 token 不落盘（.git/config）
          persist-credentials: false
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check default features
        run: cargo check --workspace
      # 示例 grpc 模块非 default（protoc 隔离），显式补一条编译校验
      # （此作业已装 protoc）
      - name: Check examples grpc feature
        run: cargo check -p nexusflow-examples --no-default-features --features grpc
      # --all-features 会同时启用互斥的 db-* 三组（dbnexus 守卫必触发），
      # 改为按后端逐一检查；db-sqlite 已由 default 覆盖
      - name: Check db-postgres features
        # -p 限定到本包：workspace 形态会把示例成员的 default db-sqlite 拉入
        # 特性联合，dbnexus 互斥守卫必触发（与 README 本地校验口径逐字一致）
        run: cargo check -p nexusflow --no-default-features --features "full,db-postgres"
      - name: Check db-mysql features
        run: cargo check -p nexusflow --no-default-features --features "full,db-mysql"
      # 单特性组合回归网：database/web-server 的隐式前提（logging/infrastructure）
      # 若被拆掉，这两条立即编译失败（矩阵口径见 tests/matrix/feature_matrix.rs）
      - name: Check single-feature combos
        run: |
          cargo check -p nexusflow --no-default-features --features "database,db-sqlite"
          cargo check -p nexusflow --no-default-features --features "web-server,db-sqlite"
          cargo check -p nexusflow --no-default-features --features "logging,db-sqlite"

  #-----------------------------------------------------------------------------
  # 测试（mockito/mockall 自包含，无外部服务依赖）
  #-----------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 只读 token 不落盘（.git/config）
          persist-credentials: false
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # --all-features 因 db-* 互斥不可用（同 check 注释）；测试跑 default
      # 口径（full + db-sqlite，mockito/mockall 自包含）
      - name: Run tests
        run: cargo test --workspace

  #-----------------------------------------------------------------------------
  # 三平台编译（跨平台约束的 CI 落点）
  # 默认特性（full + db-sqlite）经 bundled sqlite 静态编译（libsqlite3-sys
  # 的 cc 构建 C 源），三平台均无系统库前置；grpc 不在默认面，无需 protoc。
  # 默认图另含 aws-lc-sys（rustls 后端），其 C 构建需 cmake（Windows 另需
  # NASM）——GH runner 镜像自带，无需额外安装
  #-----------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # 超时按实测留 5~6 倍余量（冷编约 92s + checkout/工具链/缓存开销；
    # windows 编译与链接更慢），把单腿挂死的尾部成本压住
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 30 || 20 }}
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 只读 token 不落盘（.git/config）
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: cross-${{ runner.os }}
      # --all-features 因 db-* 互斥不可用（同 check 注释），改「默认 + 零特性」
      # 两口径；二者均已本机验证通过
      - name: Build (default features)
        run: cargo build --workspace
      - name: Build (no default features)
        run: cargo build --workspace --no-default-features

  #-----------------------------------------------------------------------------
  # 文档构建（零警告：断链、私有项链接、无效 HTML 一并拦下）
  #-----------------------------------------------------------------------------
  doc:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 只读 token 不落盘（.git/config）
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build documentation (zero warnings)
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  #-----------------------------------------------------------------------------
  # 覆盖率（生成 + 上传 Codecov）
  # 注意：暂不设 --fail-under-lines 门禁——首次测量前不知道真实基线，
  # 先采集数据，基线明确后再按 confers 基线加 ≥80% 行覆盖率门禁。
  #-----------------------------------------------------------------------------
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 只读 token 不落盘（.git/config）
          persist-credentials: false
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage
        # --all-features 因 db-* 互斥不可用（同 check 注释）；覆盖率按 default
        # 口径采集，与 test job 一致
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          fail_ci_if_error: false

  #-----------------------------------------------------------------------------
  # 供应链安全（每日 schedule 唯一响应者；cargo audit 只读 Cargo.lock，
  # 无需编译）
  #-----------------------------------------------------------------------------
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 只读 token 不落盘（.git/config）
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Install cargo-audit
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit
