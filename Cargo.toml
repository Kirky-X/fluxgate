[package]
name = "nexusflow"
version = "0.1.0"
edition = "2021"
description = "智能 LLM 路由代理系统 - 多厂商统一管理、格式转换、智能调度 | Intelligent multi-provider LLM routing gateway"
authors = ["Kirky-X <Kirky-X@outlook.com>"]
repository = "https://github.com/Kirky-X/NexusFlow"
keywords = ["llm", "gateway", "proxy", "openai", "anthropic", "routing"]
categories = ["network-programming", "web-programming::http-server", "api-bindings"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "nexusflow"
path = "src/main.rs"
required-features = ["full"]

[features]
default = ["full"]
full = ["web-server", "database", "vendor-management", "router", "protocol", "infrastructure", "sdforge-integration", "logging", "resilience", "cost-tracking"]
web-server = ["dep:axum", "dep:tower", "dep:tower-http", "dep:async-stream", "router", "sdforge-integration", "http"]
# sdforge `#[forge]` 宏按**目标 crate** 的 feature 求值 `cfg(feature = "http")`
# （rustc check-cfg 文档明确此语义）：无同名 feature 时 RouteRegistration
# 整体被 cfg 掉，#[forge] 站点路由（/health）静默丢失。此 feature 无实现体，
# 仅作为宏门控开关随 web-server 启用。
http = []
# resilience feature：韧性模块门控（FallbackChain + 错误映射层）。熔断器已迁移
# limiteron::circuit、重试延迟已迁移 limiteron::retry，无需独立第三方依赖
resilience = []
cost-tracking = ["dep:dashmap"]
database = ["dep:dbnexus", "dep:sea-orm", "dep:async-channel", "protocol"]
vendor-management = ["dep:reqwest", "dep:limiteron", "database"]
# router 带 oxcache（recId=11 会话亲和表 / recId=12 响应缓存的存储层——
# CacheWriter::set/get/expire 的 TTL 续期语义由库提供，不手写 map）
router = ["vendor-management", "dep:oxcache"]
protocol = []
infrastructure = ["dep:oxcache", "dep:trait-kit"]
sdforge-integration = ["dep:sdforge"]
logging = ["dep:inklog"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("openapi"))'] }

[dependencies]
# Web 框架
axum = { version = "0.8", features = ["macros"], optional = true }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.7", features = ["cors", "trace", "request-id"], optional = true }

# 数据库 — path dep 确保使用本地 trait-kit 0.3（kit feature 暴露 integrations::kit::DbNexusModule）
dbnexus = { path = "../dbnexus", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "permission", "sql-parser", "macros", "config-env", "with-time", "kit"], optional = true }
sea-orm = { version = "2.0.0-rc.42", default-features = false, optional = true }

# 日志 — path dep 确保 oxcache/dbnexus/trait-kit 全部本地对齐
inklog = { path = "../inklog", default-features = false, features = ["http", "cli", "sqlite", "kit"], optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", optional = true }

# 流控 — path dep 确保 trait-kit 0.3 对齐；"retry" 提供重试原语（recId=7：
# delay_for_attempt / RetryPolicy），删除 backon 后唯一的重试延迟实现
limiteron = { path = "../limiteron", default-features = false, features = ["tower-middleware", "ban-manager", "circuit-breaker", "gcra", "quota-control", "retry", "kit"], optional = true }

# 缓存 — path dep 确保 trait-kit 0.3 对齐
oxcache = { path = "../oxcache", default-features = false, features = ["minimal", "macros", "kit", "memory"], optional = true }

# DI — path dep（本地源码 0.3.0）
trait-kit = { path = "../trait-kit", default-features = false, features = ["async"], optional = true }

# SDK 框架 — path dep（本地 0.3.5 已修复 limiteron::FlowGuardError 不兼容问题）
sdforge = { path = "../sdforge", default-features = false, features = ["http", "security", "streaming"], optional = true }

# 序列化与核心
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
futures = "0.3"
futures-util = "0.3"
tokio-util = "0.7"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
once_cell = "1"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
bytes = "1"
reqwest = { version = "0.13", features = ["json", "stream", "socks"], optional = true }
async-channel = { version = "2", optional = true }
async-stream = { version = "0.3", optional = true }
# 成本追踪（cost-tracking feature）：CostTracker 的分片锁并发 map（by_vendor/by_model）
# 评估过 oxcache：其 DashMapMemoryBackend 是带 TTL 语义的缓存后端封装，不是裸并发
# map 能力暴露，不适合当 CostTracker 容器，故引入通用并发 map dashmap。
# 版本取 6：cost_tracker.rs 使用 entry()/new() 现代 API，与 confers 的 dashmap 6.2 对齐；
# dashmap 1.2（version="1" 解析到的版本）无 entry() 且 new() 需传 chunk 参数，API 不兼容。
dashmap = { version = "6", optional = true }
# 配置热更新地基：confers::dynamic::DynamicField 提供无锁内存热读态，
# confers::loader::load_file 提供带路径防护/大小限制的文件加载，
# confers::snapshot::SnapshotManager 提供更新前的时间戳快照与超量清理
confers = { path = "../confers", default-features = false, features = ["toml", "dynamic", "snapshot"] }
# API Key SHA256 摘要存储与常量时间比较（auth 层）
sha2 = "0.10"
hex = "0.4"
sys-info = "0.9"
toml = "1"

# i18n — Fluent 双束（en/zh）+ 语言检测链基座；fluent 系走 crates.io，
# 不经 [patch.crates-io]（该段仅重定向自研库）
fluent-bundle = { version = "0.16", default-features = false }
unic-langid = { version = "0.9", default-features = false }
sys-locale = { version = "0.3", default-features = false }

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.15"
mockall_double = "0.3"
http-body = "1.0"
futures-util = "0.3"
mockito = "1"
# 测试需要注入 limiteron MockClock（假时钟驱动熔断超时 / 限流窗口重置）；
# MockClock 仅在 test-clock feature 下从 limiteron 公开（limiteron src/lib.rs:320）
limiteron = { path = "../limiteron", features = ["test-clock"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# 统一自研库身份：所有对 crates.io 上自研库的依赖都重定向到同级本地源码，
# 避免 path 版与 registry 版并存导致 trait 身份分裂
[patch.crates-io]
trait-kit = { path = "../trait-kit" }
confers = { path = "../confers" }
dbnexus = { path = "../dbnexus" }
inklog = { path = "../inklog" }
limiteron = { path = "../limiteron" }
sdforge = { path = "../sdforge" }
oxcache = { path = "../oxcache" }
