[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# 自研库全量走 crates.io registry（本地对齐以同版本发布保证）；
# 原本地重定向（[patch.crates-io]）在全部库同版本发布后移除。
# 若需临时回到本地开发态：给主依赖加回 path = "../<lib>"，并在本文件
# 末尾恢复 [patch.crates-io] 段（否则 path 版与 registry 版并存会 trait 身份分裂）。

[workspace]
# 示例集合并为单一 crate（examples/），内部按 feature 划分模块与 bin。
members = [
    "examples",
]
