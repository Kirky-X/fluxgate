[package]
name = "smart_llm_proxy"
version = "0.1.0"
edition = "2021"
description = "智能 LLM 路由代理系统 - 多厂商统一管理、格式转换、智能调度"
authors = ["SmartLlmProxy"]

[lib]
path = "src/lib.rs"

[dependencies]
# Web 框架
axum = { version = "0.8.8", features = ["macros"] }
tokio = { version = "1.42", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "request-id"] }

# 配置管理
toml = "0.8"

# 数据库 - 升级到 0.8 以兼容 sea-orm (dbnexus 依赖)
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP 客户端
reqwest = { version = "0.12", features = ["json", "stream", "socks"] }

# 异步工具
async-trait = "0.1"
futures = "0.3"
futures-util = "0.3"

# 并发控制
tokio-util = "0.7"
async-channel = "2.3"

# 日志
tracing = "0.1"
tracing-subscriber = "0.3"

# 时间处理
chrono = { version = "0.4", features = ["serde"] }

# 错误处理
anyhow = "1.0"
thiserror = "1.0"

# 随机数
rand = "0.8"

# 全局状态
once_cell = "1.19"

# UUID
uuid = { version = "1.0", features = ["v4", "serde"] }

# URL 解析
url = "2.5"

# 缓存
moka = { version = "0.12", features = ["future"] }

# 系统信息
sys-info = "0.9"

# 字节处理
bytes = "1.0"
async-stream = "0.3"

# Local DI-compliant infrastructure libraries (Phase 1: Infrastructure Layer)
# These will replace the above dependencies in Phase 2
# SQLite version conflict resolved by upgrading to sqlx 0.8
oxcache = { path = "/home/dev/projects/oxcache", default-features = false, features = ["moka", "macros", "serialization"] }
confers = { path = "/home/dev/projects/confers" }
dbnexus = { path = "/home/dev/projects/dbnexus" }
sdforge = { path = "/home/dev/projects/sdforge", features = ["http", "security", "streaming"] }

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.13"
mockall_double = "0.3"
http-body = "1.0"
futures-util = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
